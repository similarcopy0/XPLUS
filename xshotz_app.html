<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❌ˢʰᵒᵗᶻ - Short Video Platform</title>
    <style>
        /* TikTok/Reels Style CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
            height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar - TikTok Style */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 44px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .tab {
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            min-width: fit-content;
        }

        .tab.active {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: scale(1.02);
        }

        .tab:not(.active) {
            color: rgba(255, 255, 255, 0.8);
        }

        .tab:not(.active):hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .close-btn {
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s ease;
            color: #fff;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
            opacity: 0.9;
            transition: all 0.2s ease;
            border-radius: 50%;
            padding: 8px;
        }

        .top-icon:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Live Stats Component - TikTok Style */
        .live-stats {
            position: fixed;
            top: 44px;
            left: 0;
            right: 0;
            height: 24px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 12px;
            color: #fff;
            z-index: 999;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .live-icon {
            font-size: 14px;
            opacity: 0.9;
        }

        .divider {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 300;
        }

        /* Video Feed */
        .video-feed {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .video-item {
            position: relative;
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-player {
            width: 100%;
            height: 100vh;
            object-fit: cover;
            background: #000;
        }

        /* Video Meta Overlay - Bottom Left */
        .video-meta {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(
                180deg,
                transparent 0%,
                rgba(0, 0, 0, 0.3) 30%,
                rgba(0, 0, 0, 0.8) 100%
            );
            padding: 40px 16px 16px;
            z-index: 100;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .profile-icon {
            font-size: 18px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        .category-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
        }

        .video-title {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.4;
            color: #fff;
            margin-bottom: 8px;
            max-width: 70%;
        }

        .expand-btn {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }

        .expand-btn:hover {
            color: #fff;
        }

        /* Right Action Bar - TikTok Style */
        .action-bar {
            position: fixed;
            right: 12px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 8px;
            border-radius: 50%;
        }

        .action-item:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.1);
        }

        .action-item:active {
            transform: scale(0.95);
        }

        .action-icon {
            font-size: 20px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .action-count {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.9);
            min-width: 40px;
            text-align: center;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        /* Like animation */
        .action-item.liked .action-icon {
            color: #ff4757;
            animation: likeAnimation 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes likeAnimation {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Comment Drawer - Modern Design */
        .comment-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70vh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            border-radius: 20px 20px 0 0;
        }

        .comment-drawer.open {
            transform: translateY(0);
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .comment-filter {
            display: flex;
            gap: 12px;
        }

        .filter-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            color: rgba(255, 255, 255, 0.8);
        }

        .filter-btn.active {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .comment-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .comment-item {
            margin-bottom: 16px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .comment-user {
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 4px;
            color: #fff;
        }

        .comment-text {
            font-size: 14px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.9);
        }

        .comment-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        .comment-input-container {
            padding: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.8);
        }

        .comment-input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .comment-input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .comment-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        /* Search Overlay - Modern */
        .search-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .search-overlay.open {
            display: flex;
        }

        .search-container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .search-input {
            width: 100%;
            background: none;
            border: none;
            padding: 16px 20px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Video Cards for Grid - TikTok Style */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            padding: 2px;
        }

        .video-card {
            position: relative;
            aspect-ratio: 9/16;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .video-card:hover {
            transform: scale(0.98);
        }

        .card-thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(
                180deg,
                transparent 0%,
                rgba(0, 0, 0, 0.8) 100%
            );
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 11px;
        }

        .card-stats {
            display: flex;
            gap: 12px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 3px;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #fff;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 10000;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Progress Bar */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 10;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ee5a24);
            width: 0%;
            transition: width 0.1s ease;
            border-radius: 0 2px 2px 0;
        }

        /* Fullscreen mode */
        .fullscreen .top-bar,
        .fullscreen .action-bar,
        .fullscreen .video-meta {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* Loading spinner */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Double tap heart animation */
        .double-tap-heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            color: #ff4757;
            animation: heartFloat 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes heartFloat {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .top-bar {
                height: 40px;
                padding: 0 12px;
            }

            .tab {
                font-size: 14px;
                padding: 4px 10px;
            }

            .action-bar {
                right: 8px;
                gap: 16px;
            }

            .video-meta {
                padding: 30px 12px 12px;
            }

            .comment-drawer {
                height: 75vh;
            }

            .search-overlay {
                padding: 16px;
            }
        }

        @media (max-width: 480px) {
            .top-bar {
                height: 36px;
                padding: 0 8px;
            }

            .tab {
                font-size: 13px;
                padding: 3px 8px;
            }

            .action-bar {
                right: 6px;
                gap: 14px;
            }

            .video-meta {
                padding: 25px 8px 8px;
            }

            .comment-drawer {
                height: 80vh;
            }
        }

        /* Safe area for devices with notches */
        @supports (padding: max(0px)) {
            .top-bar {
                padding-top: max(16px, env(safe-area-inset-top));
                height: max(44px, calc(44px + env(safe-area-inset-top)));
            }

            .action-bar {
                margin-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="close-btn">𝕏</div>
                <div class="tab active" data-tab="for-you">For you</div>
                <div class="tab" data-tab="explore">Explore</div>
            </div>
            <div class="top-bar-right">
                <div class="top-icon" id="search-btn">🔍</div>
                <div class="top-icon">💃</div>
            </div>
        </div>

        <!-- Live Stats Component -->
        <div class="live-stats">
            <span class="live-icon">👁️‍🗨️</span>
            <span id="total-views">0</span>
            <span class="divider">|</span>
            <span id="total-videos">0</span>
        </div>

        <!-- Video Feed -->
        <div class="video-feed" id="video-feed">
            <!-- Videos will be loaded here -->
        </div>

        <!-- Right Action Bar -->
        <div class="action-bar">
            <div class="action-item" data-action="like">
                <span class="action-icon">👍🏻</span>
                <span class="action-count" id="like-count">108K</span>
            </div>
            <div class="action-item" data-action="dislike">
                <span class="action-icon">👎🏻</span>
                <span class="action-count" id="dislike-count">100K</span>
            </div>
            <div class="action-item" data-action="comment">
                <span class="action-icon">💬</span>
                <span class="action-count" id="comment-count">748K</span>
            </div>
            <div class="action-item" data-action="share">
                <span class="action-icon">♻️</span>
                <span class="action-count" id="share-count">183</span>
            </div>
            <div class="action-item" data-action="favorite">
                <span class="action-icon">♥</span>
                <span class="action-count" id="favorite-count">108K</span>
            </div>
            <div class="action-item" data-action="save">
                <span class="action-icon">💾</span>
            </div>
            <div class="action-item" data-action="history">
                <span class="action-icon">🕒</span>
            </div>
            <div class="action-item" data-action="favorites-list">
                <span class="action-icon">🌟</span>
            </div>
            <div class="action-item" data-action="trending">
                <span class="action-icon">🔥</span>
            </div>
            <div class="action-item" data-action="new">
                <span class="action-icon">🆕</span>
            </div>
            <div class="action-item" data-action="views">
                <span class="action-icon">👁️</span>
                <span class="action-count" id="view-count">108K</span>
            </div>
        </div>

        <!-- Comment Drawer -->
        <div class="comment-drawer" id="comment-drawer">
            <div class="comment-header">
                <div class="comment-filter">
                    <div class="filter-btn active" data-filter="newest">Newest</div>
                    <div class="filter-btn" data-filter="oldest">Oldest</div>
                </div>
            </div>
            <div class="comment-list" id="comment-list">
                <!-- Comments will be loaded here -->
            </div>
            <div class="comment-input-container">
                <div class="comment-input-wrapper">
                    <input type="text" class="comment-input" id="comment-input" placeholder="Add a comment...">
                    <button class="send-btn" id="send-comment">
                        🚀 Send
                    </button>
                </div>
            </div>
        </div>

        <!-- Search Overlay -->
        <div class="search-overlay" id="search-overlay">
            <div class="search-container">
                <input type="text" class="search-input" id="search-input" placeholder="Search by keyword, hashtag, title...">
            </div>
        </div>

        <!-- Toast Notification -->
        <div class="toast" id="toast"></div>

        <!-- Loading Spinner -->
        <div class="loading" id="loading"></div>
    </div>

    <script>
        // Enhanced TikTok/Reels Style JavaScript
        // Configuration
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjWd9DazL9QlO3oCtD703oJIOBEsa0D4FwbJIqjnjBQ3s_i4nsdyKS8fTjZRWpSMwhIBLPYLl8kz_n/pub?output=csv';
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby4sHkU-I0fhpTqaqc0aIRAP5q4dZCeEefFNoYWqnM91bVBSS4tk0wnJgc6pTbXOGt1xQ/exec';

        // State management
        let currentVideoIndex = 0;
        let videos = [];
        let currentVideoId = null;
        let isFullscreen = false;
        let lastTapTime = 0;
        let tapCount = 0;
        let scrollTimeout;
        let autoAdvanceCount = 0;

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            loadVideos();
            setupEventListeners();
            loadLiveStats();
            setupVideoFeed();
        });

        // Load videos from Google Sheets with improved error handling
        function loadVideos() {
            showLoading();

            // Use JSONP for CORS workaround
            const script = document.createElement('script');
            script.src = SHEET_URL + '&callback=parseVideoData';
            script.onerror = function() {
                console.error('Failed to load video data');
                showToast('Failed to load videos. Please check your connection.');
                hideLoading();
            };
            document.head.appendChild(script);

            // Timeout fallback
            setTimeout(() => {
                if (videos.length === 0) {
                    hideLoading();
                    showToast('Loading timeout. Please refresh.');
                }
            }, 10000);
        }

        // Parse video data from CSV with better parsing
        function parseVideoData(csvText) {
            try {
                const lines = csvText.split('\n');
                const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));

                videos = lines.slice(1).map((line, index) => {
                    const values = line.split(',').map(v => v.trim().replace(/"/g, ''));
                    const video = {};
                    headers.forEach((header, i) => {
                        video[header] = values[i] || '';
                    });
                    video.index = index;
                    return video;
                }).filter(video => video.id && video.videoUrl);

                // Shuffle videos for random order
                videos = videos.sort(() => Math.random() - 0.5);

                if (videos.length > 0) {
                    displayCurrentVideo();
                    updateActionCounts(videos[0]);
                    preloadNextVideos();
                } else {
                    showToast('No videos found.');
                }

                hideLoading();
            } catch (error) {
                console.error('Error parsing video data:', error);
                showToast('Error loading videos.');
                hideLoading();
            }
        }

        // Display current video with enhanced features
        function displayCurrentVideo() {
            const feed = document.getElementById('video-feed');
            feed.innerHTML = '';

            if (videos.length === 0) return;

            const video = videos[currentVideoIndex];
            const videoItem = document.createElement('div');
            videoItem.className = 'video-item';
            videoItem.innerHTML = `
                <video class="video-player" id="video-player" autoplay muted playsinline loop>
                    <source src="${video.videoUrl}" type="video/mp4">
                </video>
                <div class="video-meta">
                    <div class="profile-section">
                        <span class="profile-icon">❌ˢʰᵒᵗᶻ🫦</span>
                    </div>
                    <div class="category-info">
                        <span>👙</span>
                        <span>${video.category || 'General'}</span>
                    </div>
                    <div class="video-title">${video.title || 'Untitled'}</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            `;

            feed.appendChild(videoItem);
            currentVideoId = video.id;
            setupVideoPlayer();
        }

        // Setup video player with enhanced controls
        function setupVideoPlayer() {
            const video = document.getElementById('video-player');
            if (!video) return;

            // Video events
            video.addEventListener('timeupdate', updateProgress);
            video.addEventListener('ended', () => {
                // Auto-advance to next video after 7 videos
                autoAdvanceCount++;
                if (autoAdvanceCount >= 7) {
                    nextVideo();
                    autoAdvanceCount = 0;
                }
            });
            video.addEventListener('loadstart', showLoading);
            video.addEventListener('canplay', hideLoading);
            video.addEventListener('click', handleVideoClick);
            video.addEventListener('dblclick', handleDoubleClick);

            // Touch events for mobile
            video.addEventListener('touchend', handleTouchEnd);

            // Preload next video
            setTimeout(() => {
                if (currentVideoIndex < videos.length - 1) {
                    const nextVideo = document.createElement('video');
                    nextVideo.src = videos[currentVideoIndex + 1].videoUrl;
                    nextVideo.preload = 'metadata';
                }
            }, 1000);
        }

        // Handle video click (single tap)
        function handleVideoClick(e) {
            const currentTime = Date.now();
            const timeDiff = currentTime - lastTapTime;

            if (timeDiff < 300) {
                tapCount++;
            } else {
                tapCount = 1;
            }

            lastTapTime = currentTime;

            if (tapCount === 1) {
                // Single tap - pause/play
                const video = e.target;
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            }
        }

        // Handle double click (double tap like)
        function handleDoubleClick(e) {
            const video = e.target;
            const rect = video.getBoundingClientRect();
            const heart = document.createElement('div');
            heart.className = 'double-tap-heart';
            heart.innerHTML = '❤';
            heart.style.left = (e.clientX - rect.left) + 'px';
            heart.style.top = (e.clientY - rect.top) + 'px';

            video.parentElement.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 800);

            // Trigger like
            updateCount('like');
        }

        // Handle touch end for mobile double tap
        function handleTouchEnd(e) {
            const currentTime = Date.now();
            const timeDiff = currentTime - lastTapTime;

            if (timeDiff < 300) {
                tapCount++;
            } else {
                tapCount = 1;
            }

            lastTapTime = currentTime;

            if (tapCount === 2) {
                handleDoubleClick(e);
            }
        }

        // Update progress bar
        function updateProgress() {
            const video = document.getElementById('video-player');
            const progress = document.getElementById('progress-fill');
            if (video && progress) {
                const percent = (video.currentTime / video.duration) * 100;
                progress.style.width = percent + '%';
            }
        }

        // Toggle fullscreen
        function toggleFullscreen() {
            const container = document.querySelector('.container');
            isFullscreen = !isFullscreen;

            if (isFullscreen) {
                container.classList.add('fullscreen');
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                }
            } else {
                container.classList.remove('fullscreen');
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Setup video feed scrolling
        function setupVideoFeed() {
            const feed = document.getElementById('video-feed');
            let isScrolling = false;

            feed.addEventListener('scroll', function() {
                if (!isScrolling) {
                    window.requestAnimationFrame(function() {
                        handleVideoScroll();
                        isScrolling = false;
                    });
                    isScrolling = true;
                }
            });
        }

        // Handle video scroll for auto-advance
        function handleVideoScroll() {
            const feed = document.getElementById('video-feed');
            const scrollTop = feed.scrollTop;
            const windowHeight = window.innerHeight;
            const videoIndex = Math.round(scrollTop / windowHeight);

            if (videoIndex !== currentVideoIndex && videoIndex < videos.length) {
                currentVideoIndex = videoIndex;
                updateActionCounts(videos[currentVideoIndex]);
                preloadNextVideos();
            }
        }

        // Next video function
        function nextVideo() {
            if (currentVideoIndex < videos.length - 1) {
                currentVideoIndex++;
                displayCurrentVideo();
                scrollToCurrentVideo();
            }
        }

        // Previous video function
        function previousVideo() {
            if (currentVideoIndex > 0) {
                currentVideoIndex--;
                displayCurrentVideo();
                scrollToCurrentVideo();
            }
        }

        // Scroll to current video
        function scrollToCurrentVideo() {
            const feed = document.getElementById('video-feed');
            feed.scrollTo({
                top: currentVideoIndex * window.innerHeight,
                behavior: 'smooth'
            });
        }

        // Preload next videos for better performance
        function preloadNextVideos() {
            for (let i = currentVideoIndex + 1; i < Math.min(currentVideoIndex + 3, videos.length); i++) {
                const video = document.createElement('video');
                video.src = videos[i].videoUrl;
                video.preload = 'metadata';
            }
        }

        // Setup event listeners with enhanced functionality
        function setupEventListeners() {
            // Tab switching with animation
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');

                    const tabType = this.dataset.tab;
                    if (tabType === 'explore') {
                        showGridView();
                    } else {
                        showFeedView();
                    }
                });
            });

            // Search functionality
            document.getElementById('search-btn').addEventListener('click', function() {
                document.getElementById('search-overlay').classList.add('open');
                document.getElementById('search-input').focus();
            });

            // Search overlay close
            document.getElementById('search-overlay').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('open');
                }
            });

            // Action bar clicks with animations
            document.querySelectorAll('.action-item').forEach(item => {
                item.addEventListener('click', function() {
                    const action = this.dataset.action;
                    handleAction(action);
                });
            });

            // Comment drawer toggle
            document.querySelector('[data-action="comment"]').addEventListener('click', function() {
                document.getElementById('comment-drawer').classList.add('open');
                loadComments();
            });

            // Comment drawer close
            document.getElementById('comment-drawer').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('open');
                }
            });

            // Send comment
            document.getElementById('send-comment').addEventListener('click', sendComment);

            // Comment input enter
            document.getElementById('comment-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendComment();
                }
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                switch(e.key) {
                    case 'ArrowDown':
                    case ' ': // Spacebar for next
                        e.preventDefault();
                        nextVideo();
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        previousVideo();
                        break;
                    case 'f':
                    case 'F11':
                        e.preventDefault();
                        toggleFullscreen();
                        break;
                    case 'Escape':
                        if (isFullscreen) {
                            toggleFullscreen();
                        }
                        break;
                }
            });
        }

        // Handle actions with enhanced feedback
        function handleAction(action) {
            const actionItem = document.querySelector(`[data-action="${action}"]`);

            switch (action) {
                case 'like':
                    actionItem.classList.add('liked');
                    updateCount('like');
                    setTimeout(() => actionItem.classList.remove('liked'), 600);
                    break;
                case 'dislike':
                    updateCount('dislike');
                    break;
                case 'share':
                    showShareOptions();
                    break;
                case 'favorite':
                    updateCount('favorite');
                    break;
                case 'history':
                    showGridView('history');
                    break;
                case 'favorites-list':
                    showGridView('favorites');
                    break;
                case 'trending':
                    showGridView('trending');
                    break;
                case 'new':
                    showGridView('new');
                    break;
            }
        }

        // Update counts with animation
        function updateCount(type) {
            const countElement = document.getElementById(`${type}-count`);
            if (countElement) {
                const currentCount = parseInt(countElement.textContent.replace(/[^\d.]/g, '').replace(/M|K/g, '')) || 0;
                const newCount = currentCount + 1;

                // Animate count change
                countElement.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    countElement.style.transform = 'scale(1)';
                }, 200);

                // Format and update count
                countElement.textContent = formatCount(newCount);

                // Update Google Sheets via Apps Script
                updateGoogleSheet(type, currentVideoId, 1);

                showToast(`${type.charAt(0).toUpperCase() + type.slice(1)} updated!`);
            }
        }

        // Show share options with enhanced sharing
        function showShareOptions() {
            const shareData = {
                title: '❌ˢʰᵒᵗᶻ',
                text: 'ডাউনলোড ❌ˢʰᵒᵗᶻ অ্যাপ ☞ https://git.new/XPLUS',
                url: 'https://git.new/XPLUS'
            };

            if (navigator.share) {
                navigator.share(shareData).then(() => {
                    updateCount('share');
                }).catch(console.error);
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(shareData.text + ' ' + shareData.url).then(() => {
                    showToast('Link copied!');
                    updateCount('share');
                });
            } else {
                // Fallback for older browsers
                showToast('Sharing not supported on this device');
            }
        }

        // Show grid view for different sections
        function showGridView(type = 'explore') {
            const feed = document.getElementById('video-feed');
            feed.innerHTML = `
                <div class="grid-container" id="grid-container">
                    <!-- Grid items will be loaded here -->
                </div>
            `;

            loadGridVideos(type);
        }

        // Show feed view
        function showFeedView() {
            displayCurrentVideo();
        }

        // Load grid videos with filtering
        function loadGridVideos(type) {
            const container = document.getElementById('grid-container');
            if (!container) return;

            // Filter videos based on type
            let filteredVideos = videos;
            if (type === 'trending') {
                filteredVideos = videos.filter(v => v.is_trending === 'TRUE');
            } else if (type === 'new') {
                filteredVideos = videos.filter(v => v.new === 'TRUE');
            } else if (type === 'favorites') {
                // Load from localStorage or API
                filteredVideos = videos.filter(v => localStorage.getItem(`fav_${v.id}`) === 'true');
            } else if (type === 'history') {
                // Load from localStorage or API
                filteredVideos = videos.filter(v => localStorage.getItem(`watched_${v.id}`) === 'true');
            }

            // Shuffle for random order
            filteredVideos = filteredVideos.sort(() => Math.random() - 0.5);

            container.innerHTML = filteredVideos.map(video => `
                <div class="video-card" onclick="playVideo('${video.id}')">
                    <video class="card-thumbnail" autoplay muted playsinline loop>
                        <source src="${video.thumbnail_link || video.videoUrl}" type="video/mp4">
                    </video>
                    <div class="card-overlay">
                        <div class="card-stats">
                            <span class="stat-item">👁️ ${formatCount(video.views)}</span>
                            <span class="stat-item">👍 ${formatCount(video.likes)}</span>
                            <span class="stat-item">👎 ${formatCount(video.dislikes)}</span>
                            <span class="stat-item">❤ ${formatCount(video.favorites)}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            if (filteredVideos.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: rgba(255,255,255,0.7);">No videos found</div>';
            }
        }

        // Play video from grid
        function playVideo(videoId) {
            const videoIndex = videos.findIndex(v => v.id === videoId);
            if (videoIndex !== -1) {
                currentVideoIndex = videoIndex;
                showFeedView();

                // Mark as watched
                localStorage.setItem(`watched_${videoId}`, 'true');
            }
        }

        // Load comments with filtering
        function loadComments() {
            const commentList = document.getElementById('comment-list');
            const filter = document.querySelector('.filter-btn.active')?.dataset.filter || 'newest';

            // Sample comments - in real app, load from Google Sheets
            const sampleComments = [
                { user: 'User 1', text: 'Great video!', time: '2 hours ago' },
                { user: 'User 2', text: 'Amazing content!', time: '1 hour ago' },
                { user: 'User 3', text: 'Love this!', time: '30 minutes ago' }
            ];

            const sortedComments = filter === 'oldest' ?
                sampleComments.reverse() : sampleComments;

            commentList.innerHTML = sortedComments.map(comment => `
                <div class="comment-item">
                    <div class="comment-user">${comment.user}</div>
                    <div class="comment-text">${comment.text}</div>
                    <div class="comment-time">${comment.time}</div>
                </div>
            `).join('');
        }

        // Send comment
        function sendComment() {
            const input = document.getElementById('comment-input');
            const comment = input.value.trim();

            if (comment) {
                // Add comment to Google Sheets via Apps Script
                updateGoogleSheet('comment', currentVideoId, comment);

                // Add comment to UI
                const commentList = document.getElementById('comment-list');
                const commentItem = document.createElement('div');
                commentItem.className = 'comment-item';
                commentItem.innerHTML = `
                    <div class="comment-user">You</div>
                    <div class="comment-text">${comment}</div>
                    <div class="comment-time">Just now</div>
                `;

                commentList.insertBefore(commentItem, commentList.firstChild);
                input.value = '';
                showToast('Comment posted!');

                // Update comment count
                updateCount('comment');
            }
        }

        // Update Google Sheets via Apps Script with JSONP
        function updateGoogleSheet(type, videoId, value) {
            const callbackName = 'jsonp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            window[callbackName] = function(response) {
                console.log('Sheet updated:', response);
                delete window[callbackName];
            };

            const url = `${APPS_SCRIPT_URL}?action=${type}&videoId=${encodeURIComponent(videoId)}&value=${encodeURIComponent(value)}&timestamp=${Date.now()}&callback=${callbackName}`;

            const script = document.createElement('script');
            script.src = url;
            script.onerror = function() {
                console.error('Failed to update sheet');
            };
            document.head.appendChild(script);
        }

        // Load live stats with real-time updates
        function loadLiveStats() {
            // Update total views and video count every 30 seconds
            setInterval(() => {
                if (videos.length > 0) {
                    const totalViews = videos.reduce((sum, video) => sum + (parseInt(video.views) || 0), 0);
                    const totalVideos = videos.length;

                    document.getElementById('total-views').textContent = formatCount(totalViews);
                    document.getElementById('total-videos').textContent = totalVideos;
                }
            }, 30000);
        }

        // Update action counts for current video
        function updateActionCounts(video) {
            if (!video) return;

            document.getElementById('like-count').textContent = formatCount(video.likes);
            document.getElementById('dislike-count').textContent = formatCount(video.dislikes);
            document.getElementById('comment-count').textContent = formatCount(video.commentsCount);
            document.getElementById('favorite-count').textContent = formatCount(video.favorites);
            document.getElementById('share-count').textContent = formatCount(video.shares);
            document.getElementById('view-count').textContent = formatCount(video.views);
        }

        // Format count numbers
        function formatCount(count) {
            const num = parseInt(count) || 0;
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        // Show toast notification with animation
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Show/hide loading
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        // Search functionality with live filtering
        document.getElementById('search-input').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();

            if (searchTerm.length > 0) {
                const filteredVideos = videos.filter(video =>
                    video.title?.toLowerCase().includes(searchTerm) ||
                    video.description?.toLowerCase().includes(searchTerm) ||
                    video.category?.toLowerCase().includes(searchTerm)
                );

                // Update grid with filtered results
                const container = document.getElementById('grid-container');
                if (container) {
                    container.innerHTML = filteredVideos.map(video => `
                        <div class="video-card" onclick="playVideo('${video.id}')">
                            <video class="card-thumbnail" autoplay muted playsinline>
                                <source src="${video.thumbnail_link || video.videoUrl}" type="video/mp4">
                            </video>
                            <div class="card-overlay">
                                <div class="card-stats">
                                    <span class="stat-item">👁️ ${formatCount(video.views)}</span>
                                    <span class="stat-item">👍 ${formatCount(video.likes)}</span>
                                    <span class="stat-item">👎 ${formatCount(video.dislikes)}</span>
                                    <span class="stat-item">❤ ${formatCount(video.favorites)}</span>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            }
        });

        // Comment filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                loadComments();
            });
        });

        // Close button functionality
        document.querySelector('.close-btn').addEventListener('click', function() {
            if (window.AndroidInterface) {
                window.AndroidInterface.closeApp();
            } else {
                window.close();
            }
        });

        // Profile button functionality
        document.querySelector('.top-bar-right .top-icon:last-child').addEventListener('click', function() {
            // Open profile/internal page
            window.location.href = 'go:INTMTHB';
        });

        // Performance monitoring and optimization
        let frameCount = 0;
        let lastTime = performance.now();
        let isOnline = navigator.onLine;
        let retryCount = 0;
        const MAX_RETRIES = 3;

        function monitorPerformance() {
            frameCount++;
            const currentTime = performance.now();

            if (currentTime - lastTime >= 1000) {
                const fps = Math.round((frameCount * 1000) / (currentTime - lastTime));

                // Log performance only if it's concerning
                if (fps < 30) {
                    console.warn('Low FPS detected:', fps);
                }

                frameCount = 0;
                lastTime = currentTime;
            }

            requestAnimationFrame(monitorPerformance);
        }

        // Network status monitoring
        window.addEventListener('online', function() {
            isOnline = true;
            console.log('Connection restored');
            showToast('Connection restored');

            // Retry failed operations
            if (retryCount > 0) {
                retryFailedOperations();
            }
        });

        window.addEventListener('offline', function() {
            isOnline = false;
            console.log('Connection lost');
            showToast('Offline mode - some features may not work');
        });

        // Retry failed operations
        function retryFailedOperations() {
            if (isOnline && retryCount < MAX_RETRIES) {
                console.log('Retrying failed operations...');
                loadVideos();
                retryCount = 0;
            }
        }

        // Enhanced error handling for video loading
        function handleVideoError(video, videoId) {
            console.error('Video failed to load:', videoId);
            showToast('Video failed to load. Skipping...');

            // Mark video as failed and try next
            video.style.display = 'none';

            if (currentVideoIndex < videos.length - 1) {
                setTimeout(() => {
                    nextVideo();
                }, 1000);
            }
        }

        // Memory cleanup for better performance
        function cleanupMemory() {
            // Remove video elements that are far from viewport
            const videos = document.querySelectorAll('video');
            videos.forEach((video, index) => {
                if (Math.abs(index - currentVideoIndex) > 2) {
                    video.src = '';
                    video.load();
                }
            });
        }

        // Throttled scroll handler for better performance
        let scrollTimeout;
        const originalHandleScroll = handleVideoScroll;

        function throttledHandleScroll() {
            if (scrollTimeout) {
                clearTimeout(scrollTimeout);
            }

            scrollTimeout = setTimeout(() => {
                originalHandleScroll();
                cleanupMemory();
            }, 100);
        }

        // Replace the original scroll handler
        document.getElementById('video-feed').removeEventListener('scroll', handleScroll);
        document.getElementById('video-feed').addEventListener('scroll', throttledHandleScroll);

        // Service Worker for offline support (optional)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').then(function(registration) {
                    console.log('ServiceWorker registration successful');
                }).catch(function(err) {
                    console.log('ServiceWorker registration failed');
                });
            });
        }

        // Intersection Observer for better performance
        function setupIntersectionObserver() {
            const videoItems = document.querySelectorAll('.video-item');

            if ('IntersectionObserver' in window) {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const video = entry.target.querySelector('video');
                            if (video && video.paused) {
                                video.play().catch(e => console.log('Autoplay prevented'));
                            }
                        } else {
                            const video = entry.target.querySelector('video');
                            if (video && !video.paused) {
                                video.pause();
                            }
                        }
                    });
                }, { threshold: 0.8 });

                videoItems.forEach(item => observer.observe(item));
            }
        }

        // Enhanced video loading with retry mechanism
        function loadVideoWithRetry(videoUrl, maxRetries = 3) {
            return new Promise((resolve, reject) => {
                let attempts = 0;

                function attemptLoad() {
                    attempts++;
                    const video = document.createElement('video');

                    video.addEventListener('loadeddata', () => resolve(video));
                    video.addEventListener('error', () => {
                        if (attempts < maxRetries) {
                            setTimeout(attemptLoad, 1000 * attempts);
                        } else {
                            reject(new Error('Video failed to load after ' + maxRetries + ' attempts'));
                        }
                    });

                    video.src = videoUrl;
                    video.load();
                }

                attemptLoad();
            });
        }

        // Battery level monitoring (for mobile optimization)
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                function updateBatteryStatus() {
                    console.log('Battery level:', Math.round(battery.level * 100) + '%');

                    // Reduce video quality if battery is low
                    if (battery.level < 0.2 && !battery.charging) {
                        console.log('Low battery mode: reducing quality');
                        // Could implement quality reduction here
                    }
                }

                updateBatteryStatus();
                battery.addEventListener('levelchange', updateBatteryStatus);
                battery.addEventListener('chargingchange', updateBatteryStatus);
            });
        }

        // Enhanced toast notifications with different types
        function showToast(message, type = 'info', duration = 3000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;

            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // Add CSS for different toast types
        const toastStyles = `
        .toast.success {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-left: 4px solid #4CAF50;
        }
        .toast.error {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            border-left: 4px solid #f44336;
        }
        .toast.warning {
            background: linear-gradient(135deg, #ffa726 0%, #ffb74d 100%);
            border-left: 4px solid #ff9800;
        }
        `;

        // Add styles to head
        const style = document.createElement('style');
        style.textContent = toastStyles;
        document.head.appendChild(style);

        // Initialize intersection observer after DOM is loaded
        setTimeout(setupIntersectionObserver, 1000);

        // Start performance monitoring in development
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.search.includes('debug=true')) {
            monitorPerformance();
        }
    </script>
