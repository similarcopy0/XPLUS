<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>❌ˢʰᵒᵗᶻ — XShotz Webview</title>
  <meta name="theme-color" content="#000000" />
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --muted: rgba(255,255,255,0.75);
      --muted-2: rgba(255,255,255,0.55);
      --pill: rgba(255,255,255,0.08);
      --pill-active: rgba(255,255,255,0.18);
      --accent: #06b6d4;
      --accent-2: #04AA6D;
      --danger: #ef4444;
      --like: #2ea6ff;
      --heart-like: #f43f5e;
      --heart-like-2: #22c55e;
      --overlay: rgba(0,0,0,0.35);
      --overlay-strong: rgba(0,0,0,0.55);
      --shadow: 0 6px 14px rgba(0,0,0,0.35);
      --topbar-h: 28px;
      --live-h: 0.3cm; /* per spec */
      --icon-size-sm: 15px;
      --icon-size: 22px;
      --radius-pill: 20px;
      --radius: 10px;
      --z-topbar: 1000;
      --z-actions: 900;
      --z-meta: 800;
      --z-composer: 950;
      --z-comments: 980;
      --z-toast: 1200;
      --snap-gap: 0px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji"; }

    /* Topbar */
    header.topbar {
      position: fixed; inset: 0 0 auto 0; height: var(--topbar-h);
      z-index: var(--z-topbar);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 6px; background: transparent;
      backdrop-filter: blur(2px);
    }
    .topbar-left { display: flex; align-items: center; gap: 6px; }
    .btn, .tab, .icon-btn, .btn-close { appearance: none; border: 0; background: transparent; color: var(--text); }
    .btn-close { font-size: 18px; line-height: 1; padding: 4px 6px; border-radius: 8px; opacity: 0.9; }
    .btn-close:active { transform: scale(0.98); opacity: 0.7; }

    .tabs { display: inline-flex; gap: 4px; }
    .tab {
      font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 12px; color: #eee; background: transparent;
    }
    .tab.active { background: var(--pill-active); color: #fff; }
    .tab:active { transform: scale(0.98); }

    .topbar-right { display: flex; align-items: center; gap: 6px; padding-right: 6px; }
    .icon-btn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; font-size: 22px; color: #fafafa; }
    .icon-btn:active { transform: scale(0.96); opacity: 0.85; }

    /* Live stats (under Explore, but inside topbar) */
    .live-container { padding: 2px 0; display: inline-flex; align-items: center; justify-content: center; background-color: transparent; }
    .live-inner { background: transparent; color:#fff; border-radius: 999px; height: 100%; padding: 0; display: inline-flex; align-items: center; gap: 0; }
    .live-icon { font-size: 11.5px; margin-right: 0.03cm; color: #fff; }
    .live-text { font-weight: 700; color: #fff; font-size: 11.5px; }
    .live-divider { margin: 0 0.03cm; color: #fff; opacity: 0.9; font-size: 11.5px; }

    /* Search bar overlay */
    .search-wrap { position: fixed; top: calc(var(--topbar-h) + 4px); left: 0; right: 0; display: none; z-index: var(--z-topbar); }
    .search-inner { margin: 0 auto; max-width: 80%; padding: 0 10px; }
    .search-bar { width: 100%; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.12); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; backdrop-filter: blur(6px); }
    .search-input { flex: 1; border: 0; background: transparent; color: #fff; padding: 6px 10px; height: var(--live-h); font-size: 13px; outline: none; }
    .search-btn { background: var(--accent-2); color: #fff; border: 0; padding: 4px 12px; border-radius: 8px; font-weight: 600; height: 26px; white-space: nowrap; }
    .search-suggestions { margin-top: 6px; display: none; gap: 6px; flex-wrap: wrap; }
    .suggestion { font-size: 12px; color: #fff; background: var(--pill); padding: 4px 8px; border-radius: 999px; }

    /* App main areas */
    main#app { position: relative; width: 100%; height: 100vh; overflow: hidden; }

    /* For You feed */
    .feed { position: absolute; inset: 0; top: 0; height: 100vh; overflow-y: auto; scroll-snap-type: y mandatory; scroll-padding-top: 0; }
    .feed.hidden { display: none; }
    .scroller { display: grid; gap: var(--snap-gap); }
    .video-card { position: relative; width: 100%; height: 100vh; scroll-snap-align: start; overflow: hidden; background: #000; }
    .video-card video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }

    /* Tap to toggle UI */
    .ui-hidden header.topbar, .ui-hidden .live-container, .ui-hidden .search-wrap, .ui-hidden .action-bar, .ui-hidden .meta-overlay, .ui-hidden .progress-bar { opacity: 0; pointer-events: none; transition: opacity .2s ease; }

    /* Right vertical action bar */
    .action-bar { position: absolute; right: 8px; bottom: 16vh; display: flex; flex-direction: column; align-items: flex-end; gap: 18px; z-index: var(--z-actions); }
    .action { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: rgba(255,255,255,0.9); background: transparent; border: 0; }
    .action-item { flex-direction: column; align-items: center; gap: 0; }
    .action-item .count { margin-top: 4px; }
    .action .ico { font-size: 16px; line-height: 1; }
    .action .count { font-size: 14px; color: rgba(230,238,242,0.95); }
    .action:active { transform: scale(1.15); }

    /* Bottom-left meta overlay */
    .meta-overlay { position: absolute; left: 8px; right: 8px; bottom: 0; z-index: var(--z-meta); padding: 10px 8px 8px; background: linear-gradient(to top left, rgba(0,0,0,0.65), rgba(0,0,0,0)); }
    .profile-name { font-weight: 800; font-size: 15px; }
    .meta-line { margin-top: 4px; font-size: 12px; color: rgba(255,255,255,0.9); display: flex; align-items: center; gap: 6px; }
    .meta-line .divider { opacity: 0.8; }
    .caption { display: inline; }
    .caption .more { background: transparent; border: 0; color: #fff; opacity: 0.85; text-decoration: underline; font-size: 12px; }

    /* Progress bar (shows on interaction) */
    .progress-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.25); opacity: 0; transition: opacity .2s ease; }
    .progress { width: 0%; height: 100%; background: var(--accent); }
    .progress-bar.show { opacity: 1; }

    /* Grid sections (Explore, Favorites, History, Trending, New) */
    .grid-section { position: absolute; inset: 0; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); overflow-y: auto; padding: 8px 6px 20vh; display: none; }
    .grid-section.active { display: block; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .card { position: relative; background: #111; border-radius: 8px; overflow: hidden; }
    .card video { width: 100%; height: 42vh; object-fit: cover; background: #000; display: block; }
    .card-overlay { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 6px; background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0)); display: flex; align-items: center; gap: 8px; }
    .mini { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: rgba(255,255,255,0.9); }

    /* Comments drawer */
    .drawer { position: fixed; left: 0; right: 0; bottom: 0; top: 20vh; background: rgba(10,10,10,0.95); box-shadow: 0 -10px 30px rgba(0,0,0,0.5); border-top-left-radius: 12px; border-top-right-radius: 12px; transform: translateY(100%); transition: transform .22s ease; z-index: var(--z-comments); display: flex; flex-direction: column; }
    .drawer.open { transform: translateY(0%); }
    .drawer-header { padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .drawer-title { font-weight: 700; font-size: 14px; opacity: 0.95; }
    .drawer-tabs { display: inline-flex; gap: 6px; }
    .drawer-tab { font-size: 12px; padding: 4px 8px; border-radius: 999px; background: var(--pill); color: #fff; border: 0; }
    .drawer-tab.active { background: var(--pill-active); }
    .drawer-list { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
    .comment-item { background: rgba(255,255,255,0.06); border-radius: 8px; padding: 8px; }
    .comment-meta { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .comment-text { font-size: 13px; color: #fff; }

    /* Comment composer */
    .composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-composer); padding: 10px 10px calc(10px + env(keyboard-inset-bottom)); background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0)); display: none; }
    .composer.show { display: block; }
    .composer-inner { background: rgba(255,255,255,0.08); border-radius: 18px; display: flex; align-items: center; gap: 6px; padding: 6px; }
    .composer-input { flex: 1; background: transparent; border: 0; color: #fff; font-size: 13px; padding: 6px; outline: none; }
    .composer-send { background: var(--accent); color: #fff; font-weight: 700; border: 0; padding: 6px 10px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; }

    /* Share popup */
    .popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(92vw, 420px); background: rgba(20,20,20,0.98); border-radius: 12px; box-shadow: var(--shadow); z-index: var(--z-toast); display: none; }
    .popup.open { display: block; }
    .popup-body { padding: 14px; display: grid; gap: 8px; }
    .popup-title { font-weight: 800; font-size: 16px; margin-bottom: 4px; }
    .share-btn { display: block; width: 100%; text-align: left; background: rgba(255,255,255,0.08); padding: 10px; border-radius: 10px; border: 0; color: #fff; }

    /* Toast */
    .toast { position: fixed; left: 50%; bottom: 10vh; transform: translateX(-50%); background: rgba(255,255,255,0.12); color: #fff; padding: 8px 12px; border-radius: 999px; box-shadow: var(--shadow); z-index: var(--z-toast); opacity: 0; transition: opacity .2s ease; }
    .toast.show { opacity: 1; }

    /* Heart double-tap animation */
    .heart-pop { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(0.8); font-size: 64px; opacity: 0; pointer-events: none; animation: heart-pop .35s ease forwards; }
    @keyframes heart-pop { 0% { transform: translate(-50%,-50%) scale(0.6); opacity: 0; } 60% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.0); opacity: 0; } }

    /* Responsive tweaks */
    @media (max-width: 420px) {
      .card video { height: 38vh; }
      .topbar-right .icon-btn { font-size: 20px; }
      .profile-name { font-size: 14px; }
      .meta-line { font-size: 11px; }
    }
  </style>
</head>
<body>
  <header class="topbar" aria-label="Top bar">
    <div class="topbar-left">
      <button class="btn-close" aria-label="Close" id="btnClose">𝕏</button>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="forYou" id="tabForYou" role="tab" aria-selected="true">For you</button>
        <button class="tab" data-tab="explore" id="tabExplore" role="tab" aria-selected="false">Explore</button>
      </div>
      <div class="live-container" aria-live="polite">
        <div class="live-inner" id="liveStats">
          <span class="live-icon">👁️‍🗨️</span>
          <span class="live-text view-count" id="liveViews">0</span>
          <span class="live-divider">|</span>
          <span class="live-text video-count" id="liveVideos">0</span>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="btnSearch" aria-label="Search">🔍</button>
      <a class="icon-btn" id="btnProfile" href="go:INTMTHB" aria-label="Profile">💃</a>
    </div>
  </header>

  <div class="search-wrap" id="searchWrap">
    <div class="search-inner">
      <div class="search-bar">
        <input id="searchInput" class="search-input" placeholder="Search by keyword, hashtag, title…" aria-label="Search input" />
        <button id="searchButton" class="search-btn">Search</button>
      </div>
      <div id="searchSuggestions" class="search-suggestions"></div>
    </div>
  </div>

  <main id="app">
    <!-- For You Feed -->
    <section id="forYou" class="feed" aria-label="For you feed">
      <div class="scroller" id="feedScroller"></div>
    </section>

    <!-- Explore -->
    <section id="explore" class="grid-section" aria-label="Explore grid">
      <div class="grid" id="gridExplore"></div>
    </section>

    <!-- Saves / Favorites List / Watched History / Trending / New -->
    <section id="profileList" class="grid-section" aria-label="Profile videos">
      <div class="grid" id="gridProfile"></div>
    </section>
    <section id="favoritesList" class="grid-section" aria-label="Favorites list">
      <div class="grid" id="gridFavorites"></div>
    </section>
    <section id="savesList" class="grid-section" aria-label="Saves list">
      <div class="grid" id="gridSaves"></div>
    </section>
    <section id="historyList" class="grid-section" aria-label="Watched history">
      <div class="grid" id="gridHistory"></div>
    </section>
    <section id="trendingList" class="grid-section" aria-label="Trending">
      <div class="grid" id="gridTrending"></div>
    </section>
    <section id="newList" class="grid-section" aria-label="New">
      <div class="grid" id="gridNew"></div>
    </section>

    <!-- Comments Drawer -->
    <aside id="commentsDrawer" class="drawer" aria-label="Comments drawer" aria-hidden="true">
      <div class="drawer-header">
        <div class="drawer-title" id="commentsTitle">Comments</div>
        <div class="drawer-tabs" role="tablist">
          <button class="drawer-tab active" data-sort="newest">Newest</button>
          <button class="drawer-tab" data-sort="oldest">Oldest</button>
        </div>
      </div>
      <div class="drawer-list" id="commentsList"></div>
    </aside>

    <!-- Comment Composer -->
    <div class="composer" id="composer">
      <div class="composer-inner">
        <input id="commentInput" class="composer-input" placeholder="Add a comment…" aria-label="Add a comment" />
        <button id="commentSend" class="composer-send"><span>🚀</span><span>Send</span></button>
      </div>
    </div>

    <!-- Share Popup -->
    <div id="sharePopup" class="popup" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
      <div class="popup-body">
        <div class="popup-title" id="shareTitle">Share</div>
        <button class="share-btn" data-share="whatsapp">WhatsApp</button>
        <button class="share-btn" data-share="messenger">Messenger</button>
        <button class="share-btn" data-share="copy">COPY LINK</button>
        <button class="share-btn" data-share="close">Close</button>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <script>
    /* Config */
    const SHEET_PUBLIC_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjWd9DazL9QlO3oCtD703oJIOBEsa0D4FwbJIqjnjBQ3s_i4nsdyKS8fTjZRWpSMwhIBLPYLl8kz_n/pub?output=csv';
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwfShYUusrkthQ2z3-YoYcAYTtUmXdZtORgRtf-N0LO9MC64ydy9di3hyiboNO-YDs6fg/exec';

    /* State */
    let allVideos = []; // raw data from API
    let forYouVideos = []; // shuffled
    let visibleIndex = -1;
    let viewedThisSession = new Set();
    let watchedCount = 0;
    let activeVideoId = null;
    let currentCommentsVideoId = null;
    let commentsSortMode = 'newest';

    const localKeys = {
      userId: 'xshotz_user_id',
      favorites: 'xshotz_favorites',
      saves: 'xshotz_saves',
      history: 'xshotz_history'
    };

    function getOrCreateUserId() {
      let id = localStorage.getItem(localKeys.userId);
      if (!id) {
        id = 'u_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
        localStorage.setItem(localKeys.userId, id);
      }
      return id;
    }
    const userId = getOrCreateUserId();

    /* Utilities */
    function formatCount(n) {
      n = Number(n||0);
      if (n >= 1e9) return (n/1e9).toFixed(1).replace(/\.0$/, '') + 'B';
      if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/, '') + 'K';
      return String(n);
    }
    function shuffle(arr) {
      const a = arr.slice();
      for (let i=a.length-1;i>0;i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
      return a;
    }
    function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 1800); }

    function ensureGithubPlayable(url) {
      try {
        const u = new URL(url);
        if (u.hostname === 'github.com') {
          if (u.pathname.includes('/releases/download/')) return url; // already direct
          if (u.pathname.includes('/blob/')) {
            const parts = u.pathname.split('/');
            const owner = parts[1], repo = parts[2], branch = parts[4];
            const rest = parts.slice(5).join('/');
            return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${rest}`;
          }
          if (!u.search.includes('raw=true')) {
            u.searchParams.set('raw', 'true');
            return u.toString();
          }
        }
      } catch (e) {}
      return url;
    }

    /* JSONP helper */
    function jsonp(action, params={}) {
      return new Promise((resolve) => {
        const cb = 'cb_' + Math.random().toString(36).slice(2);
        params = Object.assign({}, params, { action, callback: cb });
        const qs = new URLSearchParams(params).toString();
        const s = document.createElement('script');
        s.src = APPS_SCRIPT_URL + '?' + qs;
        window[cb] = (resp) => { try { delete window[cb]; } catch(e){}; s.remove(); resolve(resp); };
        s.onerror = () => { try { delete window[cb]; } catch(e){}; s.remove(); resolve({ ok:false, error:'network' }); };
        document.body.appendChild(s);
      });
    }

    const API = {
      async getVideos() { return jsonp('getVideos'); },
      async getCounts(videoId) { return jsonp('getCounts', { videoId }); },
      async increment(videoId, metric, amount=1) { return jsonp('increment', { videoId, metric, amount, userId }); },
      async liveStats() { return jsonp('liveStats'); },
      async search(q) { return jsonp('search', { q }); }
    };

    /* Build UI */
    const feedScroller = document.getElementById('feedScroller');
    const forYouSection = document.getElementById('forYou');

    function buildVideoCard(v) {
      const playable = ensureGithubPlayable(v.videoUrl || v.video_url || '');
      const card = document.createElement('article');
      card.className = 'video-card';
      card.dataset.id = v.id;
      card.innerHTML = `
          <video playsinline webkit-playsinline loop preload="metadata" controlslist="nodownload"></video>
        <div class="action-bar" aria-label="Actions">
          <button class="action action-item like" data-metric="likes" aria-label="Like"><span class="ico">👍🏻</span><span class="count" data-k="likes">${formatCount(v.likes)}</span></button>
          <button class="action action-item dislike" data-metric="dislikes" aria-label="Dislike"><span class="ico">👎🏻</span><span class="count" data-k="dislikes">${formatCount(v.dislikes)}</span></button>
          
          <button class="action action-item share" data-action="share" aria-label="Share"><span class="ico">♻️</span><span class="count" data-k="shares">${formatCount(v.shares)}</span></button>
          <button class="action action-item favorite" data-metric="favorites" aria-label="Favorite"><span class="ico">♥</span><span class="count" data-k="favorites">${formatCount(v.favorites)}</span></button>
          
          <button class="action action-item profile" data-action="profile" aria-label="❌ˢʰᵒᵗᶻ🫦 Profile"><span class="ico">❌</span><span class="count"></span></button>
          <button class="action action-item trending" data-action="trending" aria-label="Trending"><span class="ico">🔥</span><span class="count"></span></button>
          <button class="action action-item views" data-action="views" aria-label="Views"><span class="ico">👁️</span><span class="count" data-k="views">${formatCount(v.views)}</span></button>
        </div>
        <div class="meta-overlay">
          <div class="profile-name">❌ˢʰᵒᵗᶻ🫦</div>
          <div class="meta-line"><span class="cat">👙 ${v.category || ''}</span> <span class="divider">|</span> <span class="caption"><span class="cap-text">${(v.description||'').slice(0,80)}${(v.description||'').length>80?'…':''}</span> <button class="more">more</button></span></div>
        </div>
        <div class="progress-bar"><div class="progress"></div></div>
      `;
      const vid = card.querySelector('video');
      vid.src = playable;
      vid.addEventListener('timeupdate', () => {
        const pct = (vid.currentTime / Math.max(vid.duration||1, 1)) * 100;
        card.querySelector('.progress').style.width = pct + '%';
      });
      // Toggle UI on background tap
      let lastTapAt = 0;
      card.addEventListener('click', (ev) => {
        const isOverlay = ev.target.closest('.action-bar, .meta-overlay, .progress-bar, header.topbar, .live-container');
        if (isOverlay) return;
        const now = Date.now();
        if (now - lastTapAt < 250) {
          // double tap like
          spawnHeart(card);
          onIncrement(v.id, 'likes');
        } else {
          document.body.classList.toggle('ui-hidden');
          // fullscreen toggle
          toggleFullscreen(vid);
          showProgressTemporarily(card);
        }
        lastTapAt = now;
      });
      // Actions handlers
      card.querySelectorAll('.action').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const metric = btn.dataset.metric;
          const act = btn.dataset.action;
          if (metric) {
            onIncrement(v.id, metric, btn, card);
          } else if (act === 'share') {
            openShare(v);
            onIncrement(v.id, 'shares');
          } else if (act === 'profile') {
            openProfile();
          } else if (act === 'trending') {
            openExplore();
          }
        });
      });
      // Caption expand
      card.querySelector('.more').addEventListener('click', (e) => {
        e.stopPropagation();
        const cap = card.querySelector('.cap-text');
        if (cap.dataset.expanded === '1') { cap.textContent = (v.description||'').slice(0,80) + ((v.description||'').length>80?'…':''); cap.dataset.expanded = '0'; }
        else { cap.textContent = v.description || ''; cap.dataset.expanded = '1'; }
      });
      // Category tap -> open category grid
      const catEl = card.querySelector('.meta-line .cat');
      if (catEl) {
        catEl.addEventListener('click', (e)=>{ e.stopPropagation(); openCategory(v.category || ''); });
      }
      return card;
    }

    function spawnHeart(card) {
      const h = document.createElement('div');
      h.className = 'heart-pop'; h.textContent = '❤';
      card.appendChild(h); setTimeout(()=>h.remove(), 450);
    }
    function showProgressTemporarily(card) {
      const pb = card.querySelector('.progress-bar');
      pb.classList.add('show');
      setTimeout(()=>pb.classList.remove('show'), 3000);
    }

    async function onIncrement(videoId, metric, btn, card) {
      btn && (btn.style.transform = 'scale(1.15)');
      const res = await API.increment(videoId, metric, 1);
      setTimeout(()=>{ btn && (btn.style.transform = ''); }, 140);
      if (res && res.ok && res.data) {
        const data = res.data;
        const el = (card||document).querySelector(`[data-k="${metric}"]`);
        if (el) el.textContent = formatCount(data[metric]);
        if (metric === 'likes' && card) {
          const ico = card.querySelector('.action.like .ico');
          if (ico) ico.textContent = '👍';
          if (ico) ico.style.color = '#FFD54F';
        }
        if (metric === 'favorites' && card) {
          const ico = card.querySelector('.action.favorite .ico');
          if (ico) ico.textContent = '💚';
        }
        if (metric === 'dislikes' && card) {
          const ico = card.querySelector('.action.dislike .ico');
          if (ico) ico.textContent = '👎';
          if (ico) ico.style.color = '#FFD54F';
        }
      }
    }

    function toggleFullscreen(el) {
      const doc = document;
      if (!doc.fullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
      } else {
        if (doc.exitFullscreen) doc.exitFullscreen().catch(()=>{});
      }
    }

    /* Intersection observer for autoplay/pause and views */
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const card = entry.target; const vid = card.querySelector('video');
        if (entry.isIntersecting && entry.intersectionRatio >= 0.75) {
          const id = card.dataset.id; activeVideoId = id;
          try { vid.muted = false; vid.play().catch(()=>{}); } catch(e){}
          // view count once per session per video
          if (!viewedThisSession.has(id)) {
            viewedThisSession.add(id);
            onIncrement(id, 'views', null, card);
            addHistory(id);
            watchedCount++;
            if (watchedCount >= 7) {
              watchedCount = 0; location.href = 'go:REELS';
            }
          }
          // preload next
          const next = card.nextElementSibling; if (next) { const nv = next.querySelector('video'); if (nv) nv.preload = 'auto'; }
          // update counts from server
          refreshCounts(id, card);
        } else {
          try { vid.pause(); } catch(e){}
        }
      });
    }, { threshold: [0, 0.75, 1] });

    async function refreshCounts(videoId, card) {
      const r = await API.getCounts(videoId);
      if (r && r.ok && r.data) {
        const keys = ['likes','dislikes','commentsCount','favorites','shares','views'];
        for (const k of keys) {
          const el = card.querySelector(`[data-k="${k}"]`);
          if (el) el.textContent = formatCount(r.data[k] || 0);
        }
      }
    }

    /* Build Feed */
    function renderFeed(videos) {
      feedScroller.innerHTML = '';
      videos.forEach(v => {
        const card = buildVideoCard(v); feedScroller.appendChild(card); observer.observe(card);
      });
    }

    /* Live stats */
    async function updateLiveStats() {
      try {
        const resp = await fetch(SHEET_PUBLIC_CSV, { cache: 'no-store' });
        const csv = await resp.text();
        const lines = csv.split(/\r?\n/).filter(Boolean);
        const headers = lines.shift().split(',');
        const idIdx = headers.findIndex(h=>/^(id|ID)$/i.test(h.trim()));
        const viewsIdx = headers.findIndex(h=>/^views$/i.test(h.trim()));
        let totalViews = 0; let totalVideos = 0;
        for (const line of lines) {
          const cols = line.split(',');
          if (cols[idIdx] && cols[idIdx].trim()) totalVideos++;
          const v = Number(cols[viewsIdx]||0); if (!isNaN(v)) totalViews += v;
        }
        document.getElementById('liveViews').textContent = formatCount(totalViews);
        document.getElementById('liveVideos').textContent = formatCount(totalVideos);
      } catch (e) { /* silent */ }
    }

    /* Comments removed per spec */

    /* Share popup */
    const sharePopup = document.getElementById('sharePopup');
    let shareContext = null;
    function openShare(video) { shareContext = video; sharePopup.classList.add('open'); }
    function closeShare() { shareContext = null; sharePopup.classList.remove('open'); }
    sharePopup.addEventListener('click', (e)=>{
      const btn = e.target.closest('.share-btn'); if (!btn) return; const type = btn.dataset.share;
      if (type === 'close') { closeShare(); return; }
      if (!shareContext) return;
      const link = ensureGithubPlayable(shareContext.videoUrl || '');
      if (type === 'whatsapp') {
        const u = 'https://wa.me/?text=' + encodeURIComponent('ডাউনলোড XPLUS অ্যাপ ☞ https://git.new/XPLUS');
        location.href = u;
      } else if (type === 'messenger') {
        const u = 'intent://share?link=' + encodeURIComponent('https://git.new/XPLUS') + '#Intent;scheme=fb-messenger;package=com.facebook.orca;end';
        location.href = u;
      } else if (type === 'copy') {
        const msg = '"ডাউনলোড ❌🅟Ⓛ🅤Ⓢ অ্যাপ ☞ https://git.new/XPLUS  "';
        navigator.clipboard && navigator.clipboard.writeText(msg).then(()=>toast('Link copied')); ;
      }
      setTimeout(closeShare, 150);
    });

    /* Local storage: favorites, saves, history */
    function getLocalSet(key) { try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); } catch(e) { return new Set(); } }
    function saveLocalSet(key, set) { localStorage.setItem(key, JSON.stringify(Array.from(set))); }
    function addHistory(id) { const s = getLocalSet(localKeys.history); s.add(id); saveLocalSet(localKeys.history, s); }
    function saveVideo(id) { const s = getLocalSet(localKeys.saves); const fav = getLocalSet(localKeys.favorites); let msg = 'Already saved'; if (!s.has(id)) { s.add(id); msg = 'Saved'; } if (!fav.has(id)) { fav.add(id); msg = 'Saved to Favorites'; } saveLocalSet(localKeys.saves, s); saveLocalSet(localKeys.favorites, fav); toast(msg); }
    function addFavorite(id) { const s = getLocalSet(localKeys.favorites); if (!s.has(id)) { s.add(id); saveLocalSet(localKeys.favorites, s); toast('Added to favorites'); } }

    /* Grids */
    function showGrid(id) {
      document.querySelectorAll('.grid-section').forEach(s=>s.classList.remove('active'));
      const sec = document.getElementById(id); if (sec) sec.classList.add('active');
      // hide feed when grid visible
      forYouSection.classList.toggle('hidden', true);
      document.getElementById('tabForYou').classList.remove('active');
      document.getElementById('tabExplore').classList.toggle('active', id==='explore');
    }
    function showFeed() {
      document.querySelectorAll('.grid-section').forEach(s=>s.classList.remove('active'));
      forYouSection.classList.remove('hidden');
      document.getElementById('tabForYou').classList.add('active');
      document.getElementById('tabExplore').classList.remove('active');
    }

    function buildGridCards(targetEl, items) {
      targetEl.innerHTML = '';
      const shuffled = shuffle(items);
      shuffled.forEach(v => {
        const playable = ensureGithubPlayable(v.videoUrl || '');
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = `
          <video playsinline muted autoplay loop preload="metadata" controlslist="nodownload" src="${playable}"></video>
          <div class="card-overlay">
            <span class="mini"><span>👁️</span><span>${formatCount(v.views)}</span></span>
            <span class="mini"><span>👍</span><span>${formatCount(v.likes)}</span></span>
            <span class="mini"><span>👎</span><span>${formatCount(v.dislikes)}</span></span>
            <span class="mini"><span>❤</span><span>${formatCount(v.favorites)}</span></span>
          </div>
        `;
        // Tap-to-play the SAME video in Feed
        const vid = card.querySelector('video');
        card.addEventListener('click', ()=>{
          try { if (vid.paused) { vid.play().catch(()=>{}); } } catch(e){}
          // Replace feed with shuffled list starting from this clicked video
          try {
            const idx = allVideos.findIndex(x => String(x.id) === String(v.id));
            if (idx >= 0) {
              const head = [allVideos[idx]];
              const tail = allVideos.filter((x,i)=>i!==idx);
              forYouVideos = head.concat(shuffle(tail));
              renderFeed(forYouVideos);
              showFeed();
              // Scroll to first (the same)
              const firstCard = document.querySelector('.video-card');
              if (firstCard) {
                firstCard.scrollIntoView({ block: 'start' });
                const fvid = firstCard.querySelector('video');
                if (fvid) { try { fvid.play().catch(()=>{}); } catch(e){} }
              }
            } else {
              showFeed();
            }
          } catch(e) { showFeed(); }
        });
        targetEl.appendChild(card);
      });
    }

    function openExplore() {
      const el = document.getElementById('gridExplore');
      buildGridCards(el, allVideos);
      showGrid('explore');
    }
    function openCategory(cat) {
      const el = document.getElementById('gridExplore');
      const items = allVideos.filter(v => (v.category||'').toLowerCase() === String(cat||'').toLowerCase());
      buildGridCards(el, items.length ? items : allVideos);
      showGrid('explore');
    }

    function openFavoritesList() {
      // Per spec: Favorites List (🌟) reflects locally saved items from Saves (💾)
      const savedIds = getLocalSet(localKeys.saves); const items = allVideos.filter(v=>savedIds.has(v.id));
      buildGridCards(document.getElementById('gridFavorites'), items);
      showGrid('favoritesList');
    }
    function openProfile() {
      // For now, show all videos as profile grid (can be scoped later)
      buildGridCards(document.getElementById('gridProfile'), allVideos);
      showGrid('profileList');
    }
    function openSavesList() {
      const ids = getLocalSet(localKeys.saves); const items = allVideos.filter(v=>ids.has(v.id));
      buildGridCards(document.getElementById('gridSaves'), items);
      showGrid('savesList');
    }
    function openHistoryList() {
      const ids = getLocalSet(localKeys.history); const items = allVideos.filter(v=>ids.has(v.id));
      buildGridCards(document.getElementById('gridHistory'), items);
      showGrid('historyList');
    }
    function openTrending() {
      const items = allVideos.filter(v=>String(v.is_trending||v.trending||'').toLowerCase()==='true' || String(v.is_trending||'')==='1');
      buildGridCards(document.getElementById('gridTrending'), items);
      showGrid('trendingList');
    }
    function openNew() {
      const items = allVideos.filter(v=>String(v.new||'').toLowerCase()==='true' || String(v.new||'')==='1');
      buildGridCards(document.getElementById('gridNew'), items);
      showGrid('newList');
    }

    /* Tabs */
    document.getElementById('tabForYou').addEventListener('click', ()=>{ showFeed(); });
    document.getElementById('tabExplore').addEventListener('click', ()=>{ openExplore(); });

    document.getElementById('btnClose').addEventListener('click', ()=>{ location.href = 'go:HM'; });

    /* Search */
    const searchWrap = document.getElementById('searchWrap');
    document.getElementById('btnSearch').addEventListener('click', ()=>{
      searchWrap.style.display = (searchWrap.style.display==='block') ? 'none' : 'block';
      if (searchWrap.style.display==='block') document.getElementById('searchInput').focus();
    });
    document.getElementById('searchButton').addEventListener('click', ()=>{
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!q) return;
      const results = allVideos.filter(v => Object.values(v).join(' ').toLowerCase().includes(q));
      buildGridCards(document.getElementById('gridExplore'), results);
      showGrid('explore');
    });

    /* Real-time refresh every 5s for visible video */
    setInterval(()=>{
      if (activeVideoId) {
        const card = document.querySelector(`.video-card[data-id="${activeVideoId}"]`);
        if (card) refreshCounts(activeVideoId, card);
      }
    }, 5000);

    /* Live stats every 30s */
    setInterval(updateLiveStats, 30000);

    /* Init */
    async function init() {
      updateLiveStats();
      const r = await API.getVideos();
      if (!(r && r.ok && Array.isArray(r.data))) { toast('Failed to load videos'); return; }
      allVideos = r.data.map(x=>({
        id: String(x.id||'').trim(),
        title: x.title || '',
        description: x.description || '',
        category: x.category || '',
        videoUrl: x.videoUrl || x.video_url || '',
        likes: Number(x.likes||0),
        dislikes: Number(x.dislikes||0),
        commentsCount: Number(x.commentsCount||0),
        favorites: Number(x.favorites||0),
        shares: Number(x.shares||0),
        saves: Number(x.saves||0),
        is_trending: x.is_trending,
        new: x.new,
        views: Number(x.views||0)
      }));
      forYouVideos = shuffle(allVideos);
      renderFeed(forYouVideos);
    }

    init();
  </script>
</body>
</html>
