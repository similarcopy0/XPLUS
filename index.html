<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>❌ˢʰᵒᵗᶻ</title>
  <meta name="theme-color" content="#000000" />
  <style>
    :root {
      --bg: #000;
      --fg: #ffffff;
      --fg-muted: rgba(255,255,255,0.85);
      --muted: #9aa6b2;
      --accent: #06b6d4;
      --accent-2: #04AA6D;
      --pill-bg: rgba(34,34,34,0.85);
      --overlay: rgba(0,0,0,0.35);
      --overlay-strong: rgba(0,0,0,0.6);
      --shadow: 0 4px 12px rgba(0,0,0,0.15);
      --touch: 44px; /* min touch target */
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
    a { color: inherit; text-decoration: none; }
    button { background: none; color: inherit; border: none; padding: 0; font: inherit; cursor: pointer; }

    /* Top Bar */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 8px;
      z-index: 1000;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0));
      backdrop-filter: blur(6px);
    }
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 6px; }

    .pill {
      min-height: 25px; min-width: 13px; /* accessibility min touch set on container below */
      padding: 3px 8px; border-radius: 10px; font-size: 13px; font-weight: 600;
      color: #eee;
      display: inline-flex; align-items: center; justify-content: center;
      transition: transform .12s ease, opacity .12s ease, background-color .12s ease, color .12s ease;
    }
    .pill.transparent { background: transparent; color: #eee; opacity: .9; }
    .pill.active { background: var(--pill-bg); color: #fff; }
    .icon-btn { width: var(--touch); height: var(--touch); display:flex; align-items:center; justify-content:center; border-radius: 50%; }
    .icon-btn > span { font-size: 18px; }
    .icon-btn[aria-label="Search"] > span { font-size: 22px; }
    .icon-btn[aria-label="Profile"] > span { font-size: 24px; }

    .topbar-left .icon-btn { margin-right: 3px; }
    .topbar-right { margin-right: 6px; gap: 3px; }

    .pill:active, .icon-btn:active { transform: scale(0.98); }

    /* Live Stats inside topbar */
    .live-container {
      height: 0.3cm; padding: 0 10px; display: flex; align-items: center; justify-content: center; background-color: transparent; color: #fff; font-weight: bold;
    }
    .live-icon { font-size: 14px; margin-right: 5px; }
    .divider { margin: 0 5px; opacity: 0.7; }

    /* Search overlay */
    .search-overlay { position: fixed; top: 52px; left: 0; right: 0; display: none; justify-content: center; z-index: 1000; }
    .search-bar { width: min(70%, 680px); margin: 0 15px; display: flex; overflow: hidden; border-radius: 16px; background: rgba(255,255,255,0.08); box-shadow: var(--shadow); }
    .search-bar input { flex: 1; padding: 10px; font-size: 14px; color: #fff; background: transparent; border: none; outline: none; }
    .search-bar button { background: var(--accent-2); color: #fff; padding: 0 14px; font-weight: 600; }
    .search-bar button { border-top-left-radius: 0; border-bottom-left-radius: 0; }

    /* View containers */
    .view { display: none; }
    .view.active { display: block; }

    /* Feed */
    .feed { position: fixed; top: 48px; bottom: 0; left: 0; right: 0; overflow-y: auto; scroll-snap-type: y mandatory; }
    .feed-card { position: relative; height: calc(100vh - 48px); scroll-snap-align: start; display: flex; align-items: center; justify-content: center; background: #000; }
    .feed-card video { width: 100%; height: 100%; object-fit: cover; background: #000; }

    /* Progress bar */
    .progress-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,0.25); transform-origin: left; transform: scaleX(0); transition: transform .12s linear; }
    .progress-bar.visible { opacity: 1; }

    /* Video action bar (right) */
    .video-action-bar { position: absolute; right: 8px; bottom: 20%; display: flex; flex-direction: column; align-items: center; gap: 18px; z-index: 10; }
    .action-item { display: flex; align-items: center; gap: 4px; font-size: 15px; color: #fff; cursor: pointer; user-select: none; min-height: 24px; }
    .action-item .count { font-size: 12px; color: rgba(255, 255, 255, 0.85); }
    .action-item:active { transform: scale(1.15); transition: transform 0.2s ease, color 0.2s ease; }

    /* Bottom-left profile & caption overlay */
    .video-info-overlay { position: absolute; bottom: 0; left: 0; padding: 8px 8px 12px 8px; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); box-sizing: border-box; z-index: 9; }
    .profile-name { font-size: 15px; font-weight: bold; color: #fff; margin-bottom: 2px; }
    .meta-line { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta-line .category { font-size: 10px; color: #fff; font-weight: 600; }
    .meta-line .divider { opacity: 0.7; }
    .caption { flex: 1; font-size: 12px; color: rgba(255,255,255,0.85); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .caption .more { font-size: 12px; color: #00bfff; cursor: pointer; }

    /* Comment drawer */
    .drawer { position: fixed; left: 0; right: 0; bottom: -100%; top: 20%; background: rgba(10,10,10,0.9); backdrop-filter: blur(8px); border-top-left-radius: 16px; border-top-right-radius: 16px; z-index: 800; display: flex; flex-direction: column; transition: transform .2s ease, bottom .2s ease; }
    .drawer.open { bottom: 0; }
    .drawer-header { padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .drawer-title { font-weight: 700; }
    .drawer-tabs { display: flex; gap: 8px; }
    .tab { padding: 6px 10px; border-radius: 12px; background: rgba(255,255,255,0.08); font-size: 12px; }
    .tab.active { background: var(--pill-bg); }
    .drawer-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
    .comment-item { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .comment-meta { font-size: 11px; color: #bbb; margin-bottom: 4px; }

    /* Comment input bar */
    .composer { position: sticky; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.5); padding: 8px 10px; display: flex; align-items: center; gap: 8px; border-top-left-radius: 12px; border-top-right-radius: 12px; }
    .composer .input { flex: 1; height: 28px; display: flex; align-items: center; background: rgba(255,255,255,0.04); border-radius: 20px; padding: 0 10px; }
    .composer input { flex: 1; height: 24px; border: none; background: transparent; color: #fff; outline: none; font-size: 13px; }
    .composer .send { position: relative; height: 28px; min-width: 74px; background: var(--accent); color: #fff; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; padding: 0 10px; gap: 6px; font-weight: 700; }

    /* Explore grid and other grids */
    .grid-view { position: fixed; top: 48px; bottom: 0; left: 0; right: 0; overflow-y: auto; padding: 8px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .grid-card { position: relative; background: #111; border-radius: 8px; overflow: hidden; }
    .grid-card video, .grid-card img { width: 100%; height: 100%; aspect-ratio: 9/16; object-fit: cover; display: block; }
    .grid-stats { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 4px 6px; background: rgba(0,0,0,0.5); color: #fff; font-size: 11px; }

    /* Share popover */
    .share-pop { position: absolute; right: 48px; bottom: 20%; background: rgba(0,0,0,0.85); border-radius: 10px; padding: 8px; display: none; flex-direction: column; gap: 6px; box-shadow: var(--shadow); z-index: 11; }
    .share-pop.open { display: flex; }
    .share-link { font-size: 13px; color: #9ee7ff; }

    /* Immersive mode */
    .immersive .topbar, .immersive .video-action-bar, .immersive .video-info-overlay, .immersive .search-overlay { display: none !important; }

    /* Accessibility helpers */
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* RTL support */
    .rtl { direction: rtl; }

    /* Active like/dislike/favorite colors */
    .liked .like-icon { filter: hue-rotate(45deg) saturate(1.6); }
    .disliked .dislike-icon { filter: hue-rotate(45deg) saturate(1.6); }
    .favorited .heart-icon { color: #00ff5f; }

    /* Count update animation */
    .count-update { animation: scaleUp .2s ease; }
    @keyframes scaleUp { 0% { transform: scale(1);} 50% { transform: scale(1.2);} 100% { transform: scale(1);} }

  </style>
</head>
<body>
  <!-- Topbar -->
  <div class="topbar" role="navigation" aria-label="Top bar navigation">
    <div class="topbar-left">
      <a href="go:HM" class="icon-btn" aria-label="Close" title="Close/Home"><span>𝕏</span></a>
      <button id="tabForYou" class="pill active" aria-label="For You">For You</button>
      <button id="tabExplore" class="pill transparent" aria-label="Explore">Explore</button>
      <div class="live-container" aria-live="polite" title="Live video stats">
        <span class="live-icon">👁️‍🗨️</span>
        <span class="view-count">0</span>
        <span class="divider">|</span>
        <span class="video-count">0</span>
      </div>
    </div>
    <div class="topbar-right">
      <button id="btnSearch" class="icon-btn" aria-label="Search" title="Search"><span>🔍</span></button>
      <a href="go:INTMTHB" id="btnProfile" class="icon-btn" aria-label="Profile" title="Profile"><span>💃</span></a>
    </div>
  </div>

  <!-- Search overlay -->
  <div id="searchOverlay" class="search-overlay" role="search">
    <div class="search-bar">
      <input id="searchInput" type="search" placeholder="Search by keyword, hashtag, title…" aria-label="Search input" />
      <button id="searchSubmit" aria-label="Submit search">Search</button>
    </div>
  </div>

  <!-- Views -->
  <main>
    <section id="viewFeed" class="view active">
      <div id="feed" class="feed" aria-label="For You feed"></div>
    </section>

    <section id="viewExplore" class="view">
      <div id="exploreGrid" class="grid-view" aria-label="Explore grid"></div>
    </section>

    <section id="viewSearch" class="view">
      <div id="searchGrid" class="grid-view" aria-label="Search results"></div>
    </section>

    <section id="viewProfile" class="view">
      <div id="profileGrid" class="grid-view" aria-label="Profile grid"></div>
    </section>
  </main>

  <!-- Comments drawer -->
  <aside id="commentsDrawer" class="drawer" aria-modal="true" role="dialog" aria-label="Comments">
    <div class="drawer-header">
      <div class="drawer-title">Comments</div>
      <div class="drawer-tabs" role="tablist">
        <button class="tab active" data-sort="newest" role="tab" aria-selected="true">Newest</button>
        <button class="tab" data-sort="oldest" role="tab" aria-selected="false">Oldest</button>
      </div>
      <button id="closeDrawer" class="pill" aria-label="Close comments">Close</button>
    </div>
    <div id="commentsList" class="drawer-list"></div>
    <div class="composer">
      <div class="input">
        <input id="commentInput" type="text" placeholder="Add a comment…" aria-label="Add a comment" />
      </div>
      <button id="sendComment" class="send" aria-label="Send comment">🚀 <span>Send</span></button>
    </div>
  </aside>

  <!-- Share popover (contextual) -->
  <div id="sharePop" class="share-pop" role="menu" aria-label="Share options">
    <a class="share-link" target="_blank" rel="noopener" data-share="wa">WhatsApp</a>
    <a class="share-link" target="_blank" rel="noopener" data-share="msgr">Messenger</a>
    <a class="share-link" data-share="copy">Copy Link</a>
  </div>

  <script>
  (function() {
    'use strict';

    /* =============================
       Configuration & Endpoints
    ============================== */
    const SHEET_ID = '1PdAMnyrm6cIHUioi-MGcjMFgbmpn-Wa0zrXtTpuY7vE';
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjWd9DazL9QlO3oCtD703oJIOBEsa0D4FwbJIqjnjBQ3s_i4nsdyKS8fTjZRWpSMwhIBLPYLl8kz_n/pub?output=csv';
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby4sHkU-I0fhpTqaqc0aIRAP5q4dZCeEefFNoYWqnM91bVBSS4tk0wnJgc6pTbXOGt1xQ/exec';

    const WATCH_TO_REELS_THRESHOLD = 5; // auto-open go:REELS after 5 videos

    /* =============================
       State
    ============================== */
    const appState = {
      userId: ensureUserId(),
      contentRows: [],
      commentsByVideoId: new Map(),
      visibleIndex: 0,
      watchedCounter: 0,
      currentVideoId: null,
      isImmersive: false,
      searchQuery: '',
      sortCommentsBy: 'newest',
      savedIds: loadLocalSet('xshotz_saves'),
      favoriteIds: loadLocalSet('xshotz_favs'),
      watchedHistory: loadLocalArray('xshotz_watched'),
      audioUnlocked: false,
    };

    function ensureUserId() {
      const key = 'xshotz_uid';
      let id = localStorage.getItem(key);
      if (!id) {
        id = 'u_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem(key, id);
      }
      return id;
    }
    function loadLocalSet(key) { try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); } catch { return new Set(); } }
    function saveLocalSet(key, set) { localStorage.setItem(key, JSON.stringify(Array.from(set))); }
    function loadLocalArray(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch { return []; } }

    /* =============================
       Utilities
    ============================== */
    const qs = (sel, root=document) => root.querySelector(sel);
    const qsa = (sel, root=document) => Array.from(root.querySelectorAll(sel));

    function shuffle(array) {
      const arr = array.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function formatCount(n) {
      if (n == null || isNaN(n)) return '0';
      if (n < 1000) return String(n);
      if (n < 1_000_000) return (n/1000).toFixed(n % 1000 >= 100 ? 1 : 0) + 'K';
      return (n/1_000_000).toFixed(n % 1_000_000 >= 100_000 ? 1 : 0) + 'M';
    }

    function parseCsv(text) {
      // Simple CSV splitter (no quoted commas handling for brevity)
      const rows = text.split(/\r?\n/).filter(Boolean).map(r => r.split(','));
      const header = rows.shift();
      const idx = Object.fromEntries(header.map((k, i) => [k.trim(), i]));
      return rows.map(r => ({
        id: r[idx['id']],
        title: r[idx['title']],
        description: r[idx['description']],
        category: r[idx['category']],
        videoUrl: r[idx['videoUrl']],
        thumbnail: r[idx['thumbnail_link']] || r[idx['thumbnail']] || '',
        likes: Number(r[idx['likes']]||0),
        dislikes: Number(r[idx['dislikes']]||0),
        commentsCount: Number(r[idx['commentsCount']]||0),
        favorites: Number(r[idx['favorites']]||0),
        shares: Number(r[idx['shares']]||0),
        saves: Number(r[idx['saves']]||0),
        is_trending: String(r[idx['is_trending']]||'').toLowerCase() === 'true',
        newFlag: String(r[idx['new']]||'').toLowerCase() === 'true',
        views: Number(r[idx['views']]||0),
      }));
    }

    function jsonp(url) {
      return new Promise((resolve, reject) => {
        const cbName = 'cb_' + Math.random().toString(36).slice(2);
        const cleanup = () => { delete window[cbName]; script.remove(); };
        window[cbName] = (data) => { resolve(data); cleanup(); };
        const script = document.createElement('script');
        script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
        script.onerror = (e) => { cleanup(); reject(e); };
        document.head.appendChild(script);
      });
    }

    function attemptPlayWithAudio(video) {
      // Try with audio first per spec; if blocked, fallback to muted
      video.muted = false;
      const p = video.play();
      if (p && typeof p.then === 'function') {
        p.catch(() => { video.muted = true; video.play().catch(() => {}); });
      }
    }

    /* =============================
       Live Stats (CSV) every 30s
    ============================== */
    async function fetchLiveStats() {
      try {
        const response = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
        const text = await response.text();
        const rows = text.split("\n").map(r => r.split(","));
        const header = rows[0];
        const viewsIndex = header.indexOf("views");
        const idIndex = header.indexOf("id") > -1 ? header.indexOf("id") : header.indexOf("ID");
        let totalViews = 0; let totalVideos = 0;
        rows.slice(1).forEach(row => {
          if (row[idIndex]) totalVideos++;
          if (row[viewsIndex]) totalViews += parseInt(row[viewsIndex], 10) || 0;
        });
        qs('.view-count').textContent = formatCount(totalViews);
        qs('.video-count').textContent = formatCount(totalVideos);
      } catch (e) { /* noop */ }
    }

    /* =============================
       Content Loading
    ============================== */
    async function loadContent() {
      // Prefer Apps Script JSONP for content; fallback to CSV
      try {
        const data = await jsonp(`${APPS_SCRIPT_URL}?route=content`);
        appState.contentRows = normalizeContent(data);
      } catch (e) {
        const text = await fetch(SHEET_CSV_URL, { cache: 'no-store' }).then(r => r.text());
        appState.contentRows = parseCsv(text);
      }
      appState.contentRows = appState.contentRows.filter(r => !!r.videoUrl);
      renderFeed(shuffle(appState.contentRows));
      renderExploreGrid();
      preloadNext(0);
      fetchLiveStats();
    }

    function normalizeContent(data) {
      // Accept either array of objects or 2D array [rows]
      if (Array.isArray(data) && data.length && !Array.isArray(data[0])) {
        return data.map(sanitizeRow);
      }
      if (Array.isArray(data) && data.length && Array.isArray(data[0])) {
        const header = data[0];
        const idx = Object.fromEntries(header.map((k, i) => [String(k).trim(), i]));
        return data.slice(1).map(r => sanitizeRow({
          id: r[idx['id']], title: r[idx['title']], description: r[idx['description']], category: r[idx['category']],
          videoUrl: r[idx['videoUrl']], thumbnail: r[idx['thumbnail_link']] || r[idx['thumbnail']] || '',
          likes: r[idx['likes']], dislikes: r[idx['dislikes']], commentsCount: r[idx['commentsCount']], favorites: r[idx['favorites']], shares: r[idx['shares']], saves: r[idx['saves']],
          is_trending: r[idx['is_trending']], newFlag: r[idx['new']], views: r[idx['views']]
        }));
      }
      return [];
    }

    function sanitizeRow(r) {
      return {
        id: String(r.id || '').trim() || 'id_' + Math.random().toString(36).slice(2),
        title: r.title || '',
        description: r.description || '',
        category: r.category || '',
        videoUrl: fixGithubUrl(String(r.videoUrl || '')),
        thumbnail: r.thumbnail || '',
        likes: Number(r.likes || 0),
        dislikes: Number(r.dislikes || 0),
        commentsCount: Number(r.commentsCount || 0),
        favorites: Number(r.favorites || 0),
        shares: Number(r.shares || 0),
        saves: Number(r.saves || 0),
        is_trending: String(r.is_trending || '').toLowerCase() === 'true',
        newFlag: String(r.newFlag || r.new || '').toLowerCase() === 'true',
        views: Number(r.views || 0),
      };
    }

    function fixGithubUrl(url) {
      if (!url) return url;
      // Support ?raw=true and releases asset direct
      if (url.includes('github.com') && !/raw\.githubusercontent\.com/.test(url)) {
        if (!/\?raw=/.test(url)) return url + (url.includes('?') ? '&' : '?') + 'raw=1';
      }
      return url;
    }

    /* =============================
       Rendering - Feed
    ============================== */
    function renderFeed(rows) {
      const feed = qs('#feed');
      feed.innerHTML = '';
      rows.forEach((row, index) => {
        const card = document.createElement('article');
        card.className = 'feed-card';
        card.dataset.index = String(index);
        card.dataset.id = row.id;
        card.setAttribute('role', 'group');
        card.setAttribute('aria-label', `Video ${index+1}`);

        const video = document.createElement('video');
        video.src = row.videoUrl; video.loop = true; video.playsInline = true; video.preload = 'metadata'; video.poster = row.thumbnail || '';
        video.setAttribute('webkit-playsinline', '');
        video.addEventListener('click', onVideoTap);
        video.addEventListener('timeupdate', () => updateProgressBar(card, video));
        video.addEventListener('loadeddata', () => video.classList.add('loaded'));

        const progress = document.createElement('div');
        progress.className = 'progress-bar';

        const actionBar = renderActionBar(row);
        const infoOverlay = renderInfoOverlay(row);

        card.appendChild(video);
        card.appendChild(progress);
        card.appendChild(actionBar);
        card.appendChild(infoOverlay);

        feed.appendChild(card);
      });

      setupIntersection();
    }

    function renderActionBar(row) {
      const bar = document.createElement('div');
      bar.className = 'video-action-bar';

      const items = [
        { key: 'likes', icon: '👍🏻', aria: 'Like', cls: 'like-icon' },
        { key: 'dislikes', icon: '👎🏻', aria: 'Dislike', cls: 'dislike-icon' },
        { key: 'commentsCount', icon: '💬', aria: 'Comments', openComments: true },
        { key: 'shares', icon: '♻️', aria: 'Share', share: true },
        { key: 'favorites', icon: '♥', aria: 'Favorites', cls: 'heart-icon' },
        { key: 'saves', icon: '💾', aria: 'Saves', localSave: true },
        { key: 'history', icon: '🕒', aria: 'Watched History', openHistory: true },
        { key: 'favlist', icon: '🌟', aria: 'Favorites List', openFavList: true },
        { key: 'trending', icon: '🔥', aria: 'Trending', openTrending: true },
        { key: 'new', icon: '🆕', aria: 'New', openNew: true },
        { key: 'views', icon: '👁️', aria: 'Views' }
      ];

      items.forEach(item => {
        const wrap = document.createElement('div');
        wrap.className = 'action-item';
        const iconSpan = document.createElement('span');
        iconSpan.textContent = item.icon;
        if (item.cls) iconSpan.className = item.cls;
        const countSpan = document.createElement('span');
        countSpan.className = 'count';
        if (row[item.key] != null && typeof row[item.key] === 'number') countSpan.textContent = formatCount(row[item.key]);
        wrap.setAttribute('aria-label', `${item.aria} ${countSpan.textContent || ''}`.trim());

        wrap.appendChild(iconSpan);
        if (!item.localSave && !item.openHistory && !item.openFavList && !item.openTrending && !item.openNew) wrap.appendChild(countSpan);

        wrap.addEventListener('click', (ev) => {
          ev.stopPropagation();
          const card = wrap.closest('.feed-card');
          const id = card.dataset.id;
          if (item.openComments) return openComments(id);
          if (item.share) return openShare(card, id);
          if (item.localSave) return toggleSave(id, wrap);
          if (item.key === 'favorites') return toggleFavorite(id, wrap, countSpan);
          if (item.openHistory) return openGridView('history');
          if (item.openFavList) return openGridView('favorites');
          if (item.openTrending) return openGridView('trending');
          if (item.openNew) return openGridView('new');
          optimisticCount(card, item.key, countSpan);
          sendAction(id, item.key);
        }, { passive: true });

        bar.appendChild(wrap);
      });

      return bar;
    }

    function renderInfoOverlay(row) {
      const wrap = document.createElement('div');
      wrap.className = 'video-info-overlay';

      const profile = document.createElement('div');
      profile.className = 'profile-name';
      profile.textContent = '❌ˢʰᵒᵗᶻ🫦';
      profile.addEventListener('click', () => openGridView('profile'));

      const meta = document.createElement('div');
      meta.className = 'meta-line';

      const category = document.createElement('span');
      category.className = 'category';
      category.textContent = `👙 ${row.category || 'General'}`;
      category.addEventListener('click', () => openGridView('category', row.category));

      const divider = document.createElement('span');
      divider.className = 'divider';
      divider.textContent = '|';

      const caption = document.createElement('span');
      caption.className = 'caption';
      const more = document.createElement('span');
      more.className = 'more';
      more.textContent = 'more';
      const shortTitle = (row.title || '').length > 50 ? (row.title.slice(0, 50) + '… ') : (row.title || '');
      caption.textContent = shortTitle;
      caption.appendChild(more);
      let expanded = false;
      more.addEventListener('click', (e) => {
        e.stopPropagation();
        expanded = !expanded;
        if (expanded) { caption.textContent = row.title || ''; more.textContent = ' less'; caption.appendChild(more); }
        else { caption.textContent = shortTitle; more.textContent = 'more'; caption.appendChild(more); }
      });

      meta.appendChild(category);
      meta.appendChild(divider);
      meta.appendChild(caption);

      wrap.appendChild(profile);
      wrap.appendChild(meta);
      return wrap;
    }

    /* =============================
       Intersection Observer
    ============================== */
    let observer;
    function setupIntersection() {
      if (observer) observer.disconnect();
      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const card = entry.target; const video = card.querySelector('video');
          if (entry.isIntersecting && entry.intersectionRatio >= 0.8) {
            appState.visibleIndex = Number(card.dataset.index);
            appState.currentVideoId = card.dataset.id;
            showProgressTemporarily(card);
            if (appState.audioUnlocked) attemptPlayWithAudio(video); else { video.muted = true; video.play().catch(() => {}); }
            markWatched(appState.currentVideoId);
            preloadNext(appState.visibleIndex);
          } else {
            video.pause();
          }
        });
      }, { threshold: [0, .8, 1] });

      qsa('.feed-card').forEach(card => observer.observe(card));
    }

    function preloadNext(index) {
      const next = qs(`.feed-card[data-index="${index+1}"] video`);
      if (next) { next.preload = 'auto'; next.load(); }
    }

    function markWatched(id) {
      if (!id) return;
      if (!appState.watchedHistory.includes(id)) {
        appState.watchedHistory.push(id);
        localStorage.setItem('xshotz_watched', JSON.stringify(appState.watchedHistory));
      }
      appState.watchedCounter++;
      if (appState.watchedCounter % WATCH_TO_REELS_THRESHOLD === 0) navigateInternal('go:REELS');
      // Send watch event (non-blocking)
      jsonp(`${APPS_SCRIPT_URL}?route=update&field=views&videoId=${encodeURIComponent(id)}&userId=${encodeURIComponent(appState.userId)}&delta=1`).catch(()=>{});
    }

    /* =============================
       Interactions
    ============================== */
    function onVideoTap(e) {
      const now = Date.now();
      const video = e.currentTarget;
      const card = video.closest('.feed-card');
      const lastTap = Number(video.dataset.lastTap || 0);
      if (now - lastTap < 260) {
        // double tap like
        const id = card.dataset.id;
        heartPopAt(card, e.clientX, e.clientY);
        const countSpan = card.querySelector('.action-item:nth-child(1) .count');
        optimisticCount(card, 'likes', countSpan);
        sendAction(id, 'likes');
      } else {
        toggleImmersive();
        // unlock audio on first explicit tap
        if (!appState.audioUnlocked) { appState.audioUnlocked = true; attemptPlayWithAudio(video); }
      }
      video.dataset.lastTap = String(now);
    }

    function toggleImmersive() {
      appState.isImmersive = !appState.isImmersive;
      document.body.classList.toggle('immersive', appState.isImmersive);
    }

    function showProgressTemporarily(card) {
      const bar = card.querySelector('.progress-bar');
      bar.classList.add('visible');
      clearTimeout(bar._hideTimer);
      bar._hideTimer = setTimeout(() => bar.classList.remove('visible'), 3000);
    }

    function updateProgressBar(card, video) {
      const bar = card.querySelector('.progress-bar');
      const ratio = video.duration ? (video.currentTime / video.duration) : 0;
      bar.style.transform = `scaleX(${ratio})`;
    }

    function heartPopAt(container, x, y) {
      const heart = document.createElement('div');
      heart.textContent = '❤';
      heart.style.position = 'fixed';
      heart.style.left = x + 'px'; heart.style.top = y + 'px';
      heart.style.transform = 'translate(-50%,-50%) scale(1)';
      heart.style.fontSize = '48px'; heart.style.pointerEvents = 'none';
      heart.style.transition = 'transform .3s ease, opacity .3s ease';
      heart.style.opacity = '1';
      document.body.appendChild(heart);
      requestAnimationFrame(() => {
        heart.style.transform = 'translate(-50%,-70%) scale(1.4)'; heart.style.opacity = '0';
      });
      setTimeout(() => heart.remove(), 320);
    }

    function optimisticCount(card, key, span) {
      if (!span) return;
      span.classList.add('count-update');
      setTimeout(() => span.classList.remove('count-update'), 220);
      const current = span.textContent?.replace(/[^0-9.]/g, '') || '0';
      const numeric = parseInt(current, 10) || 0;
      span.textContent = formatCount(numeric + 1);
      if (key === 'favorites') card.classList.toggle('favorited', true);
      if (key === 'likes') card.classList.toggle('liked', true);
      if (key === 'dislikes') card.classList.toggle('disliked', true);
    }

    function toggleSave(id, wrap) {
      if (appState.savedIds.has(id)) appState.savedIds.delete(id); else appState.savedIds.add(id);
      saveLocalSet('xshotz_saves', appState.savedIds);
      wrap.classList.toggle('active');
    }

    function toggleFavorite(id, wrap, span) {
      if (appState.favoriteIds.has(id)) {
        // Unfavorite locally (do not decrement server-side to keep counts consistent)
        appState.favoriteIds.delete(id);
        saveLocalSet('xshotz_favs', appState.favoriteIds);
        wrap.classList.remove('active');
        const card = wrap.closest('.feed-card');
        if (card) card.classList.remove('favorited');
        return;
      }
      // Favorite: optimistic increment + server update
      appState.favoriteIds.add(id);
      saveLocalSet('xshotz_favs', appState.favoriteIds);
      wrap.classList.add('active');
      const card = wrap.closest('.feed-card');
      if (card) card.classList.add('favorited');
      if (card && span) optimisticCount(card, 'favorites', span);
      sendAction(id, 'favorites');
    }

    function openShare(card, id) {
      const pop = qs('#sharePop');
      const rect = card.getBoundingClientRect();
      pop.style.top = (rect.top + rect.height * 0.6) + 'px';
      pop.style.right = '48px';
      pop.classList.add('open');
      const href = location.href.split('#')[0] + `#video=${encodeURIComponent(id)}`;
      qsa('.share-link', pop).forEach(a => {
        a.onclick = (e) => {
          e.preventDefault();
          const type = a.dataset.share;
          const encoded = encodeURIComponent('Download ❌🅟Ⓛ🅤Ⓢ App ☞ https://git.new/XPLUS');
          if (type === 'wa') window.open(`https://wa.me/?text=${encoded}`, '_blank');
          else if (type === 'msgr') window.open('intent://share?text='+encoded+'#Intent;scheme=fb-messenger;package=com.facebook.orca;end', '_blank');
          else if (type === 'copy') navigator.clipboard?.writeText('Download ❌🅟Ⓛ🅤Ⓢ App ☞ https://git.new/XPLUS');
          sendAction(id, 'shares');
          pop.classList.remove('open');
        };
      });
      document.addEventListener('click', (ev) => { if (!pop.contains(ev.target)) pop.classList.remove('open'); }, { once: true });
    }

    function sendAction(videoId, field) {
      jsonp(`${APPS_SCRIPT_URL}?route=update&videoId=${encodeURIComponent(videoId)}&field=${encodeURIComponent(field)}&delta=1&userId=${encodeURIComponent(appState.userId)}`).catch(()=>{});
    }

    /* =============================
       Comments
    ============================== */
    let commentsOpenForId = null;
    function openComments(videoId) {
      commentsOpenForId = videoId;
      qs('#commentsDrawer').classList.add('open');
      qs('#commentInput').placeholder = `Posting to ❌ˢʰᵒᵗᶻ🫦 • ${videoId}`;
      loadComments(videoId);
      setTimeout(() => qs('#commentInput').focus(), 50);
    }

    function closeComments() { qs('#commentsDrawer').classList.remove('open'); }

    async function loadComments(videoId) {
      try {
        const res = await jsonp(`${APPS_SCRIPT_URL}?route=comments&videoId=${encodeURIComponent(videoId)}`);
        appState.commentsByVideoId.set(videoId, Array.isArray(res) ? res : []);
        renderComments();
      } catch(e) {
        renderComments();
      }
    }

    function renderComments() {
      const list = qs('#commentsList');
      const sort = appState.sortCommentsBy;
      const items = (appState.commentsByVideoId.get(commentsOpenForId) || []).slice();
      items.sort((a,b) => sort === 'newest' ? (b.timestamp - a.timestamp) : (a.timestamp - b.timestamp));
      list.innerHTML = items.map(c => `
        <div class="comment-item">
          <div class="comment-meta">@${escapeHtml(c.user)} • ${new Date(c.timestamp).toLocaleString()}</div>
          <div>${escapeHtml(c.comments)}</div>
        </div>
      `).join('');
    }

    function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }

    async function sendComment() {
      const input = qs('#commentInput');
      const text = input.value.trim();
      if (!text || !commentsOpenForId) return;
      // optimistic add
      const now = Date.now();
      const temp = { user: appState.userId.slice(0,6), comments: text, timestamp: now };
      const arr = appState.commentsByVideoId.get(commentsOpenForId) || [];
      arr.unshift(temp); appState.commentsByVideoId.set(commentsOpenForId, arr);
      renderComments(); input.value = '';
      jsonp(`${APPS_SCRIPT_URL}?route=addComment&videoId=${encodeURIComponent(commentsOpenForId)}&user=${encodeURIComponent(appState.userId)}&comments=${encodeURIComponent(text)}`).then(()=>{
        loadComments(commentsOpenForId);
      }).catch(()=>{});
    }

    /* =============================
       Explore, Search, Profile, Category
    ============================== */
    function renderExploreGrid() {
      const grid = qs('#exploreGrid');
      grid.innerHTML = '';
      const rows = shuffle(appState.contentRows);
      rows.forEach(r => grid.appendChild(renderGridCard(r)));
    }

    function renderGridCard(row) {
      const card = document.createElement('div');
      card.className = 'grid-card';
      const vid = document.createElement('video');
      vid.src = row.videoUrl; vid.muted = true; vid.autoplay = true; vid.loop = true; vid.playsInline = true; vid.preload = 'metadata';
      card.appendChild(vid);
      const bar = document.createElement('div'); bar.className = 'grid-stats';
      bar.innerHTML = `👁 ${formatCount(row.views||0)} &nbsp; 👍 ${formatCount(row.likes||0)} &nbsp; 👎 ${formatCount(row.dislikes||0)} &nbsp; ❤ ${formatCount(row.favorites||0)}`;
      card.appendChild(bar);
      card.addEventListener('click', () => openVideoInFeed(row.id));
      return card;
    }

    function openVideoInFeed(id) {
      // Scroll feed to the matching id
      const el = qs(`.feed-card[data-id="${CSS.escape(id)}"]`);
      if (el) {
        activateTab('ForYou');
        el.scrollIntoView({ behavior: 'smooth' });
      }
    }

    function openGridView(kind, arg) {
      let rows = appState.contentRows.slice();
      if (kind === 'favorites') rows = rows.filter(r => appState.favoriteIds.has(r.id));
      else if (kind === 'history') rows = rows.filter(r => appState.watchedHistory.includes(r.id));
      else if (kind === 'trending') rows = rows.filter(r => r.is_trending);
      else if (kind === 'new') rows = rows.filter(r => r.newFlag);
      else if (kind === 'profile') rows = rows; // all by default
      else if (kind === 'category') rows = rows.filter(r => (r.category||'').toLowerCase() === String(arg||'').toLowerCase());

      rows = shuffle(rows);
      const container = qs('#profileGrid');
      container.innerHTML = '';
      rows.forEach(r => container.appendChild(renderGridCard(r)));
      showView('Profile');
    }

    function doSearch(q) {
      q = (q||'').trim().toLowerCase();
      const res = appState.contentRows.filter(r => [r.title, r.description, r.category, r.id].join(' ').toLowerCase().includes(q));
      const grid = qs('#searchGrid'); grid.innerHTML = '';
      shuffle(res).forEach(r => grid.appendChild(renderGridCard(r)));
      showView('Search');
    }

    /* =============================
       Counts refresh every 5s
    ============================== */
    async function refreshCounts() {
      // Fetch lightweight counts for currently visible + neighbors
      const around = [appState.visibleIndex - 1, appState.visibleIndex, appState.visibleIndex + 1].filter(i => i >= 0);
      const ids = around.map(i => qs(`.feed-card[data-index="${i}"]`)?.dataset.id).filter(Boolean);
      if (!ids.length) return;
      try {
        const res = await jsonp(`${APPS_SCRIPT_URL}?route=counts&ids=${encodeURIComponent(ids.join(','))}`);
        if (res && typeof res === 'object') {
          Object.keys(res).forEach(id => {
            const counts = res[id];
            const card = qs(`.feed-card[data-id="${CSS.escape(id)}"]`);
            if (!card) return;
            const map = {
              1: '.action-item:nth-child(1) .count',
              2: '.action-item:nth-child(2) .count',
              3: '.action-item:nth-child(3) .count',
              4: '.action-item:nth-child(4) .count',
              5: '.action-item:nth-child(5) .count',
              11: '.action-item:nth-child(11) .count',
            };
            if ('likes' in counts) setText(card, map[1], formatCount(counts.likes));
            if ('dislikes' in counts) setText(card, map[2], formatCount(counts.dislikes));
            if ('commentsCount' in counts) setText(card, map[3], formatCount(counts.commentsCount));
            if ('shares' in counts) setText(card, map[4], formatCount(counts.shares));
            if ('favorites' in counts) setText(card, map[5], formatCount(counts.favorites));
            if ('views' in counts) setText(card, map[11], formatCount(counts.views));
          });
        }
      } catch(e) {}
    }
    function setText(root, sel, txt) { const el = qs(sel, root); if (el) el.textContent = txt; }

    /* =============================
       Navigation & Tabs
    ============================== */
    function showView(name) {
      qsa('.view').forEach(v => v.classList.remove('active'));
      qs(`#view${name}`).classList.add('active');
      if (name === 'Feed') { qs('#searchOverlay').style.display = 'none'; }
    }

    function activateTab(name) {
      // name: 'ForYou' | 'Explore'
      const isForYou = name === 'ForYou';
      qs('#tabForYou').classList.toggle('active', isForYou);
      qs('#tabForYou').classList.toggle('transparent', !isForYou);
      qs('#tabExplore').classList.toggle('active', !isForYou);
      qs('#tabExplore').classList.toggle('transparent', isForYou);
      showView(isForYou ? 'Feed' : 'Explore');
      if (!isForYou) renderExploreGrid();
    }

    function navigateInternal(href) {
      if (href === 'go:HM') activateTab('ForYou');
      else if (href === 'go:REELS') activateTab('ForYou'); // can customize
      else if (href === 'go:INTMTHB') showView('Profile');
    }

    /* =============================
       Event bindings
    ============================== */
    function bindEvents() {
      qs('#tabForYou').addEventListener('click', () => activateTab('ForYou'));
      qs('#tabExplore').addEventListener('click', () => activateTab('Explore'));
      qs('a[href="go:HM"]').addEventListener('click', (e) => { e.preventDefault(); navigateInternal('go:HM'); });
      qs('#btnProfile').addEventListener('click', (e) => { e.preventDefault(); navigateInternal('go:INTMTHB'); });

      qs('#btnSearch').addEventListener('click', () => { qs('#searchOverlay').style.display = 'flex'; qs('#searchInput').focus(); });
      qs('#searchSubmit').addEventListener('click', () => doSearch(qs('#searchInput').value));
      qs('#searchInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(e.target.value); });

      qs('#closeDrawer').addEventListener('click', closeComments);
      qsa('.tab').forEach(tab => tab.addEventListener('click', () => {
        qsa('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        appState.sortCommentsBy = tab.dataset.sort;
        renderComments();
      }));

      qs('#sendComment').addEventListener('click', sendComment);

      // Delegate clicks to handle outside share pop
      document.addEventListener('click', (e) => {
        const pop = qs('#sharePop');
        if (pop.classList.contains('open') && !pop.contains(e.target) && !e.target.closest('.action-item')) pop.classList.remove('open');
      });

      // Global click unlock audio
      window.addEventListener('click', () => { appState.audioUnlocked = true; }, { once: true });

      // 5s counts refresh
      setInterval(refreshCounts, 5000);
      // 30s live stats
      setInterval(fetchLiveStats, 30000);
    }

    /* =============================
       Bootstrap
    ============================== */
    bindEvents();
    loadContent();
    fetchLiveStats();

  })();
  </script>
</body>
</html>
