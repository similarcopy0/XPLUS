<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❌ˢʰᵒᵗᶻ - Short Video App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
            height: 100vh;
            position: relative;
        }

        /* Top Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 1000;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .close-btn {
            font-size: 20px;
            color: #fff;
            text-decoration: none;
            padding: 5px;
        }

        .nav-tabs {
            display: flex;
            gap: 5px;
        }

        .nav-tab {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            min-height: 32px;
            display: flex;
            align-items: center;
        }

        .nav-tab.active {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .nav-tab:not(.active) {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .top-icon {
            font-size: 22px;
            color: #fff;
            text-decoration: none;
            padding: 5px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .top-icon:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Live Stats */
        .live-stats {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        .live-icon {
            font-size: 14px;
        }

        /* Main Video Container */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .video-wrapper.active {
            opacity: 1;
            transform: translateY(0);
        }

        .video-wrapper.prev {
            transform: translateY(-20px);
        }

        .video-player {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Progress Bar */
        .progress-bar {
            position: absolute;
            bottom: 80px;
            left: 20px;
            right: 20px;
            height: 3px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .progress-fill {
            height: 100%;
            background: #fff;
            width: 0%;
            transition: width 0.1s ease;
        }

        .video-container.tapped .progress-bar {
            opacity: 1;
        }

        /* Vertical Action Bar */
        .action-bar {
            position: absolute;
            right: 15px;
            bottom: 20%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-item:active {
            transform: scale(1.15);
        }

        .action-icon {
            font-size: 24px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }

        .action-count {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        /* Bottom Overlay */
        .bottom-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            padding: 60px 20px 20px;
            z-index: 100;
        }

        .profile-name {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }

        .meta-line {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.4;
        }

        .category {
            color: #fff;
            font-weight: 500;
        }

        .divider {
            color: rgba(255, 255, 255, 0.5);
        }

        .caption {
            flex: 1;
        }

        .more-link {
            color: #00bfff;
            cursor: pointer;
        }

        /* Comment Drawer */
        .comment-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60vh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .comment-drawer.open {
            transform: translateY(0);
        }

        .comment-header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .comment-title {
            font-size: 16px;
            font-weight: 600;
        }

        .comment-filter {
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 12px;
        }

        .comment-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px;
        }

        .comment-item {
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .comment-user {
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .comment-text {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.4;
        }

        .comment-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        .comment-input-container {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .comment-input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 25px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .comment-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .send-btn {
            padding: 12px 16px;
            background: #00bfff;
            border: none;
            border-radius: 25px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .send-btn:hover {
            background: #0099cc;
        }

        /* Search Overlay */
        .search-overlay {
            position: fixed;
            top: 50px;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
            z-index: 999;
        }

        .search-overlay.open {
            transform: translateY(0);
        }

        .search-container {
            max-width: 70%;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 50px 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 25px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: #04AA6D;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        /* Grid Layout */
        .grid-container {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            padding: 50px 2px 0;
            background: #000;
        }

        .grid-container.active {
            display: grid;
        }

        .grid-item {
            position: relative;
            aspect-ratio: 9/16;
            overflow: hidden;
            border-radius: 8px;
        }

        .grid-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .grid-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            padding: 30px 10px 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 12px;
            color: #fff;
        }

        .grid-stats {
            display: flex;
            gap: 8px;
        }

        .grid-stat {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        /* Animations */
        @keyframes heart-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .heart-animation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            color: #ff6b6b;
            animation: heart-pop 0.6s ease;
            pointer-events: none;
            z-index: 1000;
        }

        /* Fullscreen mode */
        .video-container.fullscreen .top-bar,
        .video-container.fullscreen .bottom-overlay,
        .video-container.fullscreen .action-bar {
            opacity: 0;
            pointer-events: none;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .nav-tab {
                padding: 6px 12px;
                font-size: 13px;
            }

            .action-bar {
                right: 10px;
                gap: 15px;
            }

            .action-icon {
                font-size: 20px;
            }

            .bottom-overlay {
                padding: 40px 15px 15px;
            }

            .profile-name {
                font-size: 14px;
            }

            .meta-line {
                font-size: 12px;
            }
        }

        /* Loading spinner */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-bar-left">
            <a href="go:HM" class="close-btn">𝕏</a>
            <div class="nav-tabs">
                <a href="#" class="nav-tab active" data-tab="for-you">For You</a>
                <a href="#" class="nav-tab" data-tab="explore">Explore</a>
            </div>
        </div>
        <div class="live-stats">
            <span class="live-icon">👁️‍🗨️</span>
            <span class="view-count">0</span>
            <span class="divider">|</span>
            <span class="video-count">0</span>
        </div>
        <div class="top-bar-right">
            <a href="#" class="top-icon search-btn">🔍</a>
            <a href="go:INTMTHB" class="top-icon">💃</a>
        </div>
    </div>

    <!-- Search Overlay -->
    <div class="search-overlay">
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search by keyword, hashtag, title…">
            <button class="search-btn">Search</button>
        </div>
    </div>

    <!-- Video Feed Container -->
    <div class="video-container" id="videoContainer">
        <!-- Videos will be dynamically loaded here -->
    </div>

    <!-- Comment Drawer -->
    <div class="comment-drawer">
        <div class="comment-header">
            <span class="comment-title">Comments</span>
            <select class="comment-filter">
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
            </select>
        </div>
        <div class="comment-list"></div>
        <div class="comment-input-container">
            <input type="text" class="comment-input" placeholder="Add a comment…">
            <button class="send-btn">🚀 Send</button>
        </div>
    </div>

    <!-- Grid Container for Explore/Profile sections -->
    <div class="grid-container" id="gridContainer">
        <!-- Grid items will be dynamically loaded here -->
    </div>

    <script>
        // App State
        let currentVideoIndex = 0;
        let videosData = [];
        let commentsData = [];
        let filteredVideos = [];
        let currentTab = 'for-you';
        let watchedCount = 0;
        let searchQuery = '';

        // Google Sheets URLs - Update these with your deployed web app URLs
        const SHEET_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYED_APPS_SCRIPT_URL/exec';
        const COMMENTS_SHEET_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYED_APPS_SCRIPT_URL/exec';

        // Load video data using JSONP
        function loadVideoData(data) {
            if (!data || !Array.isArray(data) || data.length === 0) {
                console.error('No video data received');
                return;
            }

            videosData = data.slice(1); // Remove header row
            filteredVideos = [...videosData];
            loadLiveStats();
            loadVideos();
            startAutoRefresh();
        }

        // Load comments data using JSONP
        function loadCommentsData(data) {
            if (!data || !Array.isArray(data)) {
                console.error('No comments data received');
                return;
            }

            commentsData = data.slice(1); // Remove header row
        }

        // JSONP script injection
        function loadScript(url, callback) {
            const script = document.createElement('script');
            script.src = url + '?callback=' + callback;
            document.head.appendChild(script);
        }

        // Initialize app
        loadScript(SHEET_URL, 'loadVideoData');
        loadScript(COMMENTS_SHEET_URL, 'loadCommentsData');

        // Load live stats
        function loadLiveStats() {
            const totalViews = videosData.reduce((sum, video) => sum + (parseInt(video[15]) || 0), 0); // views column
            const totalVideos = videosData.length;

            document.querySelector('.view-count').textContent = formatNumber(totalViews);
            document.querySelector('.video-count').textContent = totalVideos;
        }

        // Load videos into container
        function loadVideos() {
            const container = document.getElementById('videoContainer');
            container.innerHTML = '';

            filteredVideos.forEach((video, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = `video-wrapper ${index === 0 ? 'active' : ''}`;
                wrapper.innerHTML = `
                    <video class="video-player" preload="metadata" muted playsinline>
                        <source src="${video[4]}" type="video/mp4"> <!-- videoUrl column -->
                    </video>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <div class="action-bar">
                        <div class="action-item" data-action="like" data-video-id="${video[0]}">
                            <span class="action-icon">👍</span>
                            <span class="action-count">${formatNumber(video[5] || 0)}</span>
                        </div>
                        <div class="action-item" data-action="dislike" data-video-id="${video[0]}">
                            <span class="action-icon">👎</span>
                            <span class="action-count">${formatNumber(video[6] || 0)}</span>
                        </div>
                        <div class="action-item" data-action="comment" data-video-id="${video[0]}">
                            <span class="action-icon">💬</span>
                            <span class="action-count">${formatNumber(video[7] || 0)}</span>
                        </div>
                        <div class="action-item" data-action="share" data-video-id="${video[0]}">
                            <span class="action-icon">♻️</span>
                            <span class="action-count">${formatNumber(video[9] || 0)}</span>
                        </div>
                        <div class="action-item" data-action="favorite" data-video-id="${video[0]}">
                            <span class="action-icon">♥</span>
                            <span class="action-count">${formatNumber(video[8] || 0)}</span>
                        </div>
                        <div class="action-item" data-action="save" data-video-id="${video[0]}">
                            <span class="action-icon">💾</span>
                        </div>
                        <div class="action-item" data-action="history" data-video-id="${video[0]}">
                            <span class="action-icon">🕒</span>
                        </div>
                        <div class="action-item" data-action="favorites-list" data-video-id="${video[0]}">
                            <span class="action-icon">🌟</span>
                        </div>
                        <div class="action-item" data-action="trending" data-video-id="${video[0]}">
                            <span class="action-icon">🔥</span>
                        </div>
                        <div class="action-item" data-action="new" data-video-id="${video[0]}">
                            <span class="action-icon">🆕</span>
                        </div>
                        <div class="action-item" data-action="views" data-video-id="${video[0]}">
                            <span class="action-icon">👁️</span>
                            <span class="action-count">${formatNumber(video[15] || 0)}</span>
                        </div>
                    </div>
                    <div class="bottom-overlay">
                        <div class="profile-name">❌ˢʰᵒᵗᶻ🫦</div>
                        <div class="meta-line">
                            <span class="category">${video[3] || 'General'}</span>
                            <span class="divider">|</span>
                            <span class="caption">${video[1] || 'No title'}</span>
                        </div>
                    </div>
                `;
                container.appendChild(wrapper);
            });

            setupVideoPlayers();
            setupInteractions();
        }

        // Setup video players
        function setupVideoPlayers() {
            const videos = document.querySelectorAll('.video-player');
            videos.forEach((video, index) => {
                video.addEventListener('loadedmetadata', () => {
                    if (index === 0) {
                        video.play().catch(e => console.log('Autoplay blocked:', e));
                    }
                });

                video.addEventListener('timeupdate', () => {
                    const progress = (video.currentTime / video.duration) * 100;
                    video.parentElement.querySelector('.progress-fill').style.width = progress + '%';
                });

                video.addEventListener('ended', () => {
                    // Loop video
                    video.currentTime = 0;
                    video.play();
                });
            });
        }

        // Setup interactions
        function setupInteractions() {
            // Action bar clicks
            document.querySelectorAll('.action-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const action = item.dataset.action;
                    const videoId = item.dataset.videoId;

                    switch(action) {
                        case 'like':
                            handleLike(videoId, item);
                            break;
                        case 'comment':
                            openCommentDrawer(videoId);
                            break;
                        case 'share':
                            handleShare();
                            break;
                        // Add other actions
                    }
                });
            });

            // Double tap to like
            document.getElementById('videoContainer').addEventListener('dblclick', (e) => {
                if (!e.target.closest('.action-item')) {
                    showHeartAnimation();
                    const currentVideo = filteredVideos[currentVideoIndex];
                    if (currentVideo) {
                        handleLike(currentVideo[0]);
                    }
                }
            });

            // Swipe navigation
            let startY = 0;
            let currentTranslate = 0;

            document.getElementById('videoContainer').addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
            });

            document.getElementById('videoContainer').addEventListener('touchmove', (e) => {
                const currentY = e.touches[0].clientY;
                const diff = currentY - startY;
                currentTranslate = diff;
            });

            document.getElementById('videoContainer').addEventListener('touchend', () => {
                if (Math.abs(currentTranslate) > 100) {
                    if (currentTranslate > 0) {
                        // Swipe up - previous video
                        navigateVideos('prev');
                    } else {
                        // Swipe down - next video
                        navigateVideos('next');
                    }
                }
                currentTranslate = 0;
            });

            // Tap to toggle fullscreen
            document.getElementById('videoContainer').addEventListener('click', (e) => {
                if (!e.target.closest('.action-item')) {
                    const container = document.getElementById('videoContainer');
                    container.classList.toggle('fullscreen');

                    // Hide/show progress bar
                    if (container.classList.contains('fullscreen')) {
                        container.classList.remove('tapped');
                    } else {
                        container.classList.add('tapped');
                        setTimeout(() => {
                            container.classList.remove('tapped');
                        }, 3000);
                    }
                }
            });
        }

        // Navigate videos
        function navigateVideos(direction) {
            const wrappers = document.querySelectorAll('.video-wrapper');
            const currentWrapper = wrappers[currentVideoIndex];

            if (direction === 'next') {
                currentVideoIndex = (currentVideoIndex + 1) % filteredVideos.length;
                watchedCount++;

                // Auto open reels section after 5 videos
                if (watchedCount % 5 === 0) {
                    setTimeout(() => {
                        window.location.href = 'go:REELS';
                    }, 1000);
                }
            } else {
                currentVideoIndex = currentVideoIndex > 0 ? currentVideoIndex - 1 : filteredVideos.length - 1;
            }

            // Update wrapper classes
            wrappers.forEach((wrapper, index) => {
                wrapper.classList.remove('active', 'prev');
                if (index === currentVideoIndex) {
                    wrapper.classList.add('active');
                    wrapper.querySelector('.video-player').play();
                } else if (index === (currentVideoIndex - 1 + filteredVideos.length) % filteredVideos.length) {
                    wrapper.classList.add('prev');
                }
            });
        }

        // Handle like action
        function handleLike(videoId, element) {
            // Update UI immediately (optimistic update)
            const countElement = element ? element.querySelector('.action-count') : null;
            if (countElement) {
                const currentCount = parseInt(countElement.textContent.replace(/[^\d]/g, '')) || 0;
                countElement.textContent = formatNumber(currentCount + 1);
            }

            // Send to server using JSONP
            loadScript(`${SHEET_URL}?action=like&videoId=${videoId}`, 'handleLikeResponse');
        }

        function handleLikeResponse(data) {
            if (data && data.length > 0) {
                // Update videos data with server response
                videosData = data.slice(1);
                filteredVideos = [...videosData];
                loadVideos();
            }
        }

        // Handle share action
        function handleShare() {
            const shareText = "Download ❌🅟Ⓛ🅤🅈 App ☞ https://git.new/XPLUS";
            if (navigator.share) {
                navigator.share({
                    title: '❌ˢʰᵒᵗᶻ',
                    text: shareText,
                });
            } else {
                // Fallback for browsers that don't support Web Share API
                navigator.clipboard.writeText(shareText).then(() => {
                    alert('Link copied to clipboard!');
                });
            }
        }

        // Open comment drawer
        function openCommentDrawer(videoId) {
            const drawer = document.querySelector('.comment-drawer');
            const commentList = document.querySelector('.comment-list');

            // Filter comments for current video
            const videoComments = commentsData.filter(comment => comment[1] === videoId);

            // Display comments
            commentList.innerHTML = videoComments.map(comment => `
                <div class="comment-item">
                    <div class="comment-user">${comment[2] || 'Anonymous'}</div>
                    <div class="comment-text">${comment[3] || ''}</div>
                    <div class="comment-time">${new Date(comment[4]).toLocaleDateString()}</div>
                </div>
            `).join('');

            drawer.classList.add('open');
        }

        // Show heart animation
        function showHeartAnimation() {
            const heart = document.createElement('div');
            heart.className = 'heart-animation';
            heart.textContent = '♥';
            document.getElementById('videoContainer').appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 600);
        }

        // Tab switching
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                e.preventDefault();
                const tabName = tab.dataset.tab;

                // Update active tab
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                switchTab(tabName);
            });
        });

        // Switch tab functionality
        function switchTab(tabName) {
            currentTab = tabName;

            switch(tabName) {
                case 'for-you':
                    document.getElementById('videoContainer').style.display = 'block';
                    document.getElementById('gridContainer').classList.remove('active');
                    filteredVideos = [...videosData].sort(() => Math.random() - 0.5);
                    loadVideos();
                    break;
                case 'explore':
                    loadGridView();
                    break;
            }
        }

        // Load grid view for explore tab
        function loadGridView() {
            const container = document.getElementById('gridContainer');
            document.getElementById('videoContainer').style.display = 'none';
            container.classList.add('active');

            // Shuffle videos for random order
            const shuffledVideos = [...videosData].sort(() => Math.random() - 0.5);

            container.innerHTML = shuffledVideos.map(video => `
                <div class="grid-item" data-video-id="${video[0]}">
                    <video class="grid-video" preload="metadata" muted playsinline>
                        <source src="${video[4]}" type="video/mp4">
                    </video>
                    <div class="grid-overlay">
                        <div class="grid-stats">
                            <span class="grid-stat">👁️ ${formatNumber(video[15] || 0)}</span>
                            <span class="grid-stat">👍 ${formatNumber(video[5] || 0)}</span>
                            <span class="grid-stat">👎 ${formatNumber(video[6] || 0)}</span>
                            <span class="grid-stat">❤ ${formatNumber(video[8] || 0)}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            // Setup grid video players
            container.querySelectorAll('.grid-video').forEach(video => {
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(e => console.log('Grid autoplay blocked:', e));
                });
            });
        }

        // Search functionality
        document.querySelector('.search-btn').addEventListener('click', () => {
            document.querySelector('.search-overlay').classList.add('open');
            document.querySelector('.search-input').focus();
        });

        document.querySelector('.search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            if (searchQuery) {
                filteredVideos = videosData.filter(video =>
                    (video[1] && video[1].toLowerCase().includes(searchQuery)) ||
                    (video[2] && video[2].toLowerCase().includes(searchQuery)) ||
                    (video[3] && video[3].toLowerCase().includes(searchQuery))
                );
            } else {
                filteredVideos = [...videosData];
            }

            if (currentTab === 'for-you') {
                loadVideos();
            } else {
                loadGridView();
            }
        });

        // Auto refresh data every 5 seconds
        function startAutoRefresh() {
            setInterval(() => {
                loadScript(SHEET_URL, 'loadVideoData');
            }, 5000);
        }

        // Format numbers
        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        // Close comment drawer
        document.addEventListener('click', (e) => {
            if (e.target === document.querySelector('.comment-drawer')) {
                document.querySelector('.comment-drawer').classList.remove('open');
            }
        });

        // Send comment
        document.querySelector('.send-btn').addEventListener('click', () => {
            const input = document.querySelector('.comment-input');
            const comment = input.value.trim();
            if (comment) {
                // Send to server using JSONP
                const currentVideo = filteredVideos[currentVideoIndex];
                if (currentVideo) {
                    loadScript(`${SHEET_URL}?action=comment&videoId=${currentVideo[0]}&user=You&comment=${encodeURIComponent(comment)}`, 'handleCommentResponse');
                }

                input.value = '';

                // Optimistically add comment to UI
                const commentList = document.querySelector('.comment-list');
                const newComment = document.createElement('div');
                newComment.className = 'comment-item';
                newComment.innerHTML = `
                    <div class="comment-user">You</div>
                    <div class="comment-text">${comment}</div>
                    <div class="comment-time">Just now</div>
                `;
                commentList.insertBefore(newComment, commentList.firstChild);
            }
        });

        function handleCommentResponse(data) {
            if (data && data.length > 0) {
                // Update comments data with server response
                commentsData = data.slice(1);
                console.log('Comment saved successfully');
            }
        }

        // Enter key to send comment
        document.querySelector('.comment-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.querySelector('.send-btn').click();
            }
        });
    </script>
</body>
</html>
